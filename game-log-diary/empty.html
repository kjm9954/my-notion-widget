<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게임 로그 일기 · 빈 날 채우기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    * { box-sizing:border-box; }
    html, body { min-height:100%; background:transparent; }
    body { margin:0; color:#12303C; font-family:"Pretendard Variable",-apple-system,"Helvetica Neue",sans-serif; -webkit-font-smoothing:antialiased; }
    button, a { color:inherit; font:inherit; }
    .shell { min-height:0; }
    .widget { width:100%; min-height:128px; display:flex; flex-direction:column; gap:9px; padding:15px; background:#FFFFFF; border-radius:18px; box-shadow:0 1px 2px rgba(18,48,60,.04),0 6px 18px rgba(18,48,60,.06); }
    .header { min-height:20px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .title { color:#33505C; font-size:12px; font-weight:800; }
    .count { color:#93A5AD; font-size:10px; font-weight:800; white-space:nowrap; }
    .chip-area { min-height:0; display:flex; flex:1; flex-wrap:wrap; align-content:flex-start; gap:5px; padding:8px; overflow:hidden; background:#FAFCFD; border:1px solid #F1F5F7; border-radius:12px; }
    .chip-area:not(.expanded) { max-height:73px; }
    .pill, .more { min-height:25px; display:inline-flex; align-items:center; padding:0 8px; border-radius:999px; font-size:10px; font-weight:700; text-decoration:none; }
    .pill { color:#6B8794; background:#F5F9FB; border:1px solid transparent; transition:border-color var(--t-color) var(--ease); }
    .more { color:#93A5AD; background:#FFFFFF; border:1px dashed #C6D6DD; cursor:pointer; }
    .complete { min-height:68px; display:flex; flex:1; align-items:center; justify-content:center; gap:8px; color:#0E5C7A; background:#E2F0F6; border-radius:12px; }
    .check { width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center; background:#FFFFFF; border-radius:50%; font-size:12px; font-weight:800; }
    .complete-copy { font-size:12px; font-weight:800; }
  </style>
  <link rel="stylesheet" href="../widget-frame.css">
</head>
<body class="widget-page widget-page-centered">
  <main class="shell widget-host" data-widget-host data-widget-key="widget-size-empty.html" data-widget-max-width="300" data-widget-height="128" style="--widget-max-width:300px;--widget-base-width:300px;--widget-base-height:128px;--widget-visual-height:128px">
    <section class="widget" data-widget-card aria-label="빈 날 채우기 위젯">
      <header class="header"><span class="title">빈 날 채우기</span><span class="count" id="count"></span></header>
      <div id="content"></div>
      <span class="widget-size-label" data-widget-size-label aria-hidden="true"></span>
      <button class="widget-size-handle" data-widget-scale-handle type="button" aria-label="위젯 비율 고정 크기 조절" aria-valuemin="70" aria-valuemax="100"></button>
    </section>
  </main>
  <script src="../store.js"></script>
  <script>
    (()=>{
      'use strict';
      const content=document.getElementById('content'),count=document.getElementById('count');
      let expanded=false,writtenDates=[];
      function localKey(date){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');return `${y}-${m}-${d}`;}
      function addDays(date,amount){const next=new Date(date);next.setDate(next.getDate()+amount);return next;}
      function missing(){const written=new Set(writtenDates),today=new Date();return Array.from({length:30},(_,index)=>localKey(addDays(today,-index-1))).filter(key=>!written.has(key));}
      function label(key){const [,month,day]=key.split('-').map(Number);return `${month}월 ${day}`;}
      function render(){const days=missing(),shown=expanded?days:days.slice(0,7),remaining=days.length-shown.length;count.textContent=`최근 30일 중 ${days.length}`;if(!days.length){content.className='complete';content.innerHTML='<span class="check">✓</span><span class="complete-copy">최근 30일, 다 채웠어요</span>';return;}content.className=`chip-area${expanded?' expanded':''}`;content.innerHTML=`${shown.map(key=>`<a class="pill" href="today.html?date=${key}&motion=swap" target="_blank" rel="noopener">${label(key)}</a>`).join('')}${remaining>0||expanded&&days.length>7?`<button class="more" type="button" data-more>${expanded?'접기':`＋${remaining}`}</button>`:''}`;}
      content.addEventListener('click',event=>{if(!event.target.closest('[data-more]'))return;expanded=!expanded;render();});
      async function sync(){try{writtenDates=await Store.getWrittenDates();render();}catch(_){count.textContent='불러오기 실패';}}
      window.addEventListener('focus',sync);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync();});Store.watch(sync);sync();
    })();
  </script>
  <script src="../widget-frame.js"></script>
</body>
</html>

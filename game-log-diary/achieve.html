<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게임 로그 일기 · 업적 보관함</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    * { box-sizing:border-box; }
    html, body { min-height:100%; background:transparent; }
    body { margin:0; color:#12303C; font-family:"Pretendard Variable",-apple-system,"Helvetica Neue",sans-serif; -webkit-font-smoothing:antialiased; }
    button, a { color:inherit; font:inherit; }
    .shell { min-height:0; }
    .widget { width:100%; height:430px; display:flex; flex-direction:column; gap:9px; padding:15px; overflow:hidden; background:#FFFFFF; border-radius:18px; box-shadow:0 1px 2px rgba(18,48,60,.04),0 6px 18px rgba(18,48,60,.06); }
    .fixed { flex:0 0 auto; }
    .header { min-height:22px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .title { color:#33505C; font-size:12px; font-weight:800; }
    .count { color:#93A5AD; font-size:10px; font-weight:800; }
    .list { min-height:0; display:flex; flex:1; flex-direction:column; gap:4px; padding:8px; overflow-x:hidden; overflow-y:auto; background:#FAFCFD; border:1px solid #F1F5F7; border-radius:12px; }
    .row { min-height:32px; display:flex; flex:0 0 auto; align-items:center; gap:8px; padding:6px 9px; color:#12303C; background:#FFFFFF; border-radius:9px; box-shadow:0 1px 2px rgba(18,48,60,.05); text-decoration:none; }
    .row-text { min-width:0; flex:1; overflow:hidden; font-size:11px; font-weight:700; text-overflow:ellipsis; white-space:nowrap; }
    .date { flex:0 0 auto; color:#A9BAC2; font-size:9px; font-weight:700; }
    .more { min-height:30px; flex:0 0 auto; padding:0; color:#93A5AD; background:transparent; border:0; font-size:10px; font-weight:700; cursor:pointer; }
    .empty { min-height:0; display:flex; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:5px; padding:14px; text-align:center; background:#FAFCFD; border:1px dashed #C6D6DD; border-radius:12px; }
    .empty-title { color:#33505C; font-size:12px; font-weight:800; }
    .empty-copy { color:#93A5AD; font-size:10px; font-weight:600; }
  </style>
  <link rel="stylesheet" href="../widget-frame.css">
</head>
<body class="widget-page widget-page-centered">
  <main class="shell widget-host" data-widget-host data-widget-key="widget-size-achieve.html" data-widget-max-width="300" data-widget-height="430" style="--widget-max-width:300px;--widget-base-width:300px;--widget-base-height:430px;--widget-visual-height:430px">
    <section class="widget" data-widget-card aria-label="업적 보관함 위젯">
      <div class="fixed" data-widget-fixed><header class="header"><span class="title" id="title">업적 보관함</span><span class="count" id="count">0</span></header></div>
      <div class="list" id="content" data-widget-list></div>
      <button class="widget-list-resize-handle" data-widget-list-handle type="button" aria-label="업적 목록 높이 조절"></button>
      <span class="widget-size-label" data-widget-size-label aria-hidden="true"></span>
      <button class="widget-size-handle" data-widget-scale-handle type="button" aria-label="위젯 비율 고정 크기 조절" aria-valuemin="70" aria-valuemax="100"></button>
    </section>
  </main>
  <script src="../store.js"></script>
  <script>
    (()=>{
      'use strict';
      const content=document.getElementById('content'),count=document.getElementById('count'),title=document.getElementById('title');
      let limit=10,achievements=[],knownIds=null,syncSignature='';
      function escapeHtml(value){return String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');}
      function dateLabel(key){const [,month,day]=key.split('-').map(Number);return `${month}.${day}`;}
      function render(){const all=achievements,shown=all.slice(0,Math.min(limit,30)),currentIds=new Set(all.map(item=>item.id)),added=knownIds?new Set(all.filter(item=>!knownIds.has(item.id)).map(item=>item.id)):new Set();knownIds=currentIds;count.textContent=`${all.length}`;if(!all.length){content.className='empty';content.innerHTML='<div class="empty-title">첫 업적을 기다리고 있어요</div><div class="empty-copy">일기에서 작성한 업적 또는 목표가 표시됩니다</div>';return;}content.className='list';content.innerHTML=`${shown.map(item=>`<a class="row${added.has(item.id)?' motion-new':''}" href="${item.source==='goal'?'../growth-page/goals.html':`today.html?date=${item.date}`}" target="_blank" rel="noopener"><span class="row-text">${escapeHtml(item.text)}</span><span class="date">${dateLabel(item.date)}</span></a>`).join('')}${limit<Math.min(all.length,30)?'<button class="more" type="button" data-more>더보기</button>':''}`;content.querySelectorAll('.row.motion-new').forEach(row=>widgetMotion.popIn(row));}
      content.addEventListener('click',event=>{if(!event.target.closest('[data-more]'))return;limit=Math.min(30,limit+10);render();});
      async function sync(){try{const next=await Store.getAchievements(),nextSignature=JSON.stringify(next);if(nextSignature===syncSignature)return;syncSignature=nextSignature;achievements=next;render();}catch(_){content.className='empty';content.innerHTML='<div class="empty-title">불러오기 실패</div><div class="empty-copy">잠시 후 다시 열어주세요</div>';}}
      window.addEventListener('focus',sync);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync();});Store.watch(sync);sync();
    })();
  </script>
  <script src="../widget-frame.js"></script>
</body>
</html>

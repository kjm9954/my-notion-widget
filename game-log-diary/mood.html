<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게임 로그 일기 · 기분 온도</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    * { box-sizing:border-box; }
    html, body { min-height:100%; background:transparent; }
    body { margin:0; color:#12303C; font-family:"Pretendard Variable",-apple-system,"Helvetica Neue",sans-serif; -webkit-font-smoothing:antialiased; }
    button, a { color:inherit; font:inherit; }
    .shell { min-height:0; }
    .widget { width:100%; height:402px; display:flex; flex-direction:column; gap:9px; padding:15px; overflow:hidden; background:#FFFFFF; border-radius:18px; box-shadow:0 1px 2px rgba(18,48,60,.04),0 6px 18px rgba(18,48,60,.06); }
    .fixed { display:flex; flex:0 0 auto; flex-direction:column; gap:9px; }
    .header, .control-head, .legend { display:flex; align-items:center; }
    .header { min-height:22px; justify-content:space-between; gap:8px; }
    .title { color:#33505C; font-size:12px; font-weight:800; }
    .caption { color:#93A5AD; font-size:10px; font-weight:800; }
    .today-control { display:flex; flex-direction:column; gap:7px; padding:9px; background:#FAFCFD; border:1px solid #F1F5F7; border-radius:12px; }
    .control-head { justify-content:space-between; gap:8px; }
    .control-label { color:#93A5AD; font-size:10px; font-weight:800; letter-spacing:.06em; }
    .mood-name { min-height:15px; color:#0E5C7A; font-size:12px; font-weight:800; }
    .temperature-track { display:flex; gap:4px; }
    .temperature-part { height:28px; flex:1; padding:0; background:#FFFFFF; border:1px solid #E1EAEE; border-radius:8px; cursor:pointer; transition:background-color var(--t-color) var(--ease), border-color var(--t-color) var(--ease); }
    .temperature-part.before { background:#E2F0F6; border-color:#CFE2EA; }
    .temperature-part.active { background:#0E5C7A; border-color:#0E5C7A; }
    .control-help { color:#A2B4BC; font-size:9px; font-weight:700; }
    .history { min-height:0; display:flex; flex:1; flex-direction:column; gap:7px; overflow-x:hidden; overflow-y:auto; }
    .history-label { color:#93A5AD; font-size:10px; font-weight:800; letter-spacing:.06em; }
    .mood-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px; }
    .mood-day, .mood-blank { aspect-ratio:1/1; border-radius:7px; }
    .mood-day { display:block; background:transparent; border:1px solid #F1F5F7; outline:2px solid transparent; outline-offset:-2px; }
    .mood-day.entry { background:#F5F9FB; }
    .mood-day.mood-1 { background:#DCE7ED; border-color:#DCE7ED; }
    .mood-day.mood-2 { background:#C6D6DD; border-color:#C6D6DD; }
    .mood-day.mood-3 { background:#93A5AD; border-color:#93A5AD; }
    .mood-day.mood-4 { background:#6B8794; border-color:#6B8794; }
    .mood-day.mood-5 { background:#0E5C7A; border-color:#0E5C7A; }
    .mood-day.today { outline-color:#0E5C7A; }
    .legend { gap:8px; color:#93A5AD; font-size:9px; font-weight:700; }
    .legend-item { display:inline-flex; align-items:center; gap:4px; }
    .legend-square { width:9px; height:9px; background:#DCE7ED; border-radius:2px; }
    .legend-square.warm { background:#0E5C7A; }
    .legend-none { margin-left:auto; }
    .word-section { display:flex; flex-direction:column; gap:6px; padding-top:7px; border-top:1px solid #F1F5F7; }
    .word-title { color:#93A5AD; font-size:10px; font-weight:800; letter-spacing:.06em; }
    .pills { display:flex; flex-wrap:wrap; gap:5px; }
    .pill { padding:4px 8px; color:#6B8794; background:#F5F9FB; border-radius:999px; font-size:10px; font-weight:700; }
    .empty { min-height:0; display:flex; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:5px; padding:14px; text-align:center; background:#FAFCFD; border:1px dashed #C6D6DD; border-radius:12px; }
    .empty-title { color:#33505C; font-size:12px; font-weight:800; }
    .empty-copy { color:#93A5AD; font-size:10px; font-weight:600; }
  </style>
  <link rel="stylesheet" href="../widget-frame.css">
</head>
<body class="widget-page widget-page-centered">
  <main class="shell widget-host" data-widget-host data-widget-key="widget-size-mood.html" data-widget-max-width="300" data-widget-height="402" style="--widget-max-width:300px;--widget-base-width:300px;--widget-base-height:402px;--widget-visual-height:402px">
    <section class="widget" data-widget-card aria-label="기분 온도 위젯">
      <div class="fixed" data-widget-fixed>
        <header class="header"><span class="title">기분 온도</span><span class="caption">최근 30일</span></header>
        <section class="today-control"><div class="control-head"><span class="control-label" id="controlLabel">오늘</span><span class="mood-name" id="moodName"></span></div><div class="temperature-track" id="temperature"></div><div class="control-help">오늘 온도를 골라보세요</div></section>
      </div>
      <section class="history" id="history" data-widget-list></section>
      <button class="widget-list-resize-handle" data-widget-list-handle type="button" aria-label="기분 기록 영역 높이 조절"></button>
      <span class="widget-size-label" data-widget-size-label aria-hidden="true"></span>
      <button class="widget-size-handle" data-widget-scale-handle type="button" aria-label="위젯 비율 고정 크기 조절" aria-valuemin="70" aria-valuemax="100"></button>
    </section>
  </main>
  <script src="../store.js"></script>
  <script>
    (()=>{
      'use strict';
      const NAMES=['차가움','서늘함','보통','포근함','따뜻함'];
      const temperature=document.getElementById('temperature'),moodName=document.getElementById('moodName'),history=document.getElementById('history'),controlLabel=document.getElementById('controlLabel');
      let entries={},prevMood=null,syncSignature='';
      function localKey(date){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');return `${y}-${m}-${d}`;}
      function addDays(date,amount){const next=new Date(date);next.setDate(next.getDate()+amount);return next;}
      function escapeHtml(value){return String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');}
      function moodValue(value){const n=Number(value);return Number.isInteger(n)&&n>=1&&n<=5?n:null;}
      function words(value){return [...new Set((Array.isArray(value)?value:[]).map(item=>String(item).trim()).filter(Boolean))];}
      const TODAY=localKey(new Date());
      function entryMood(entry){return moodValue(entry?.mood??entry?.quest?.mood);}
      function entryWords(entry){return words(entry?.quest?.moodTags);}
      function recent(){const today=new Date();return Array.from({length:30},(_,index)=>{const date=addDays(today,index-29),key=localKey(date),entry=entries[key];return{key,entry,mood:entryMood(entry),tags:entryWords(entry)};});}
      function renderControl(){const mood=entryMood(entries[TODAY]);moodName.textContent=mood?NAMES[mood-1]:'';temperature.innerHTML=NAMES.map((name,index)=>{const value=index+1;return `<button class="temperature-part${mood&&value<mood?' before':''}${mood===value?' active':''}" type="button" data-mood-value="${value}" aria-label="${name}"></button>`;}).join('');}
      function renderHistory(){const days=recent(),hasHistory=days.some(day=>day.mood||day.tags.length);if(!hasHistory){history.innerHTML='<div class="empty"><div class="empty-title">아직 온도를 남기지 않았어요</div><div class="empty-copy">오늘 온도를 골라보세요</div></div>';return;}const counts={};days.forEach(day=>day.tags.forEach(word=>{counts[word]=(counts[word]||0)+1;}));const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ko')).slice(0,3);history.innerHTML=`<div class="history-label">지난 30일</div><div class="mood-grid">${Array.from({length:5},()=>'<span class="mood-blank" aria-hidden="true"></span>').join('')}${days.map(day=>`<a class="mood-day${day.entry?' entry':''}${day.mood?` mood-${day.mood}`:''}${day.key===TODAY?' today':''}" href="today.html?date=${day.key}" target="_blank" rel="noopener" aria-label="${day.key}"></a>`).join('')}</div><div class="legend"><span class="legend-item"><span class="legend-square"></span>차가움</span><span class="legend-item"><span class="legend-square warm"></span>따뜻함</span><span class="legend-none">없음</span></div>${top.length?`<div class="word-section"><div class="word-title">자주 고른 단어</div><div class="pills">${top.map(([word,count])=>`<span class="pill">${escapeHtml(word)} ${count}</span>`).join('')}</div></div>`:''}`;}
      function render(){renderControl();renderHistory();}
      async function sync(){try{const rows=await Store.loadDiaryRange(localKey(addDays(new Date(),-29)),TODAY),nextRows=Array.isArray(rows)?rows:[],nextSignature=JSON.stringify(nextRows);if(nextSignature===syncSignature)return;syncSignature=nextSignature;entries=Object.fromEntries(nextRows.map(entry=>[entry.date,entry]));prevMood=entryMood(entries[TODAY]);render();}catch(_){history.innerHTML='<div class="empty"><div class="empty-title">불러오기 실패</div><div class="empty-copy">잠시 후 다시 열어주세요</div></div>';}}
      temperature.addEventListener('click',async event=>{const button=event.target.closest('[data-mood-value]'),current=entries[TODAY];if(!button||!current)return;const next=Number(button.dataset.moodValue),previous=prevMood;entries[TODAY]={...current,mood:next};renderControl();if((previous===null||next>previous)&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const parts=temperature.querySelectorAll('.temperature-part');const from=Math.min(previous||next,next),to=Math.max(previous||next,next);let order=0;for(let value=from;value<=to;value+=1){const el=parts[value-1];el.style.setProperty('--i',String(Math.min(order++,3)));el.classList.add('motion-cell-pop');el.addEventListener('animationend',()=>el.classList.remove('motion-cell-pop'),{once:true});}}prevMood=next;try{await Store.saveDiary({...current,date:TODAY,mood:next});}catch(_){sync();}});
      window.addEventListener('focus',sync);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync();});Store.watch(sync);sync();
    })();
  </script>
  <script src="../widget-frame.js"></script>
</body>
</html>

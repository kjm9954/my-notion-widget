<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게임 로그 일기 · 캘린더</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root {
      --action:#0E5C7A; --action-soft:#E2F0F6; --text:#12303C; --title:#33505C;
      --secondary:#6B8794; --muted:#93A5AD; --faint:#A2B4BC; --done:#A9BAC2;
      --q:oklch(0.62 0.09 245); --q-tint:oklch(0.975 0.017 245);
      --p:oklch(0.62 0.09 195); --p-tint:oklch(0.975 0.017 195);
    }
    * { box-sizing:border-box; }
    html, body { min-height:100%; background:transparent; }
    body { margin:0; color:var(--text); font-family:"Pretendard Variable",-apple-system,"Helvetica Neue",sans-serif; -webkit-font-smoothing:antialiased; }
    button, a { color:inherit; font:inherit; }
    .shell { min-height:0; }
    .widget { width:100%; height:546px; display:flex; flex-direction:column; gap:10px; padding:18px; overflow:hidden; background:#FFFFFF; border-radius:18px; box-shadow:0 1px 2px rgba(18,48,60,.04),0 6px 18px rgba(18,48,60,.06); }
    #app { min-height:0; display:flex; flex:1; flex-direction:column; gap:10px; }
    .calendar-head, .month-controls, .detail-head, .mode-line, .detail-meta, .section-head, .record-nav { display:flex; align-items:center; }
    .calendar-head { min-height:30px; justify-content:space-between; gap:12px; }
    .month-controls { gap:7px; }
    .month-button { width:30px; height:30px; padding:0; color:var(--secondary); background:#FFFFFF; border:1px solid #DCE7ED; border-radius:8px; font-size:24px; font-weight:600; line-height:1; cursor:pointer; }
    .month-title { min-width:92px; text-align:center; font-size:12px; font-weight:800; }
    .record-count, .detail-index { color:var(--muted); font-size:10px; font-weight:700; }
    .calendar-wrap { width:100%; min-height:0; display:flex; flex:1; flex-direction:column; gap:5px; }
    .weekday-grid, .calendar-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; }
    .calendar-grid { min-height:0; flex:1; }
    .weekday { color:var(--done); font-size:9px; font-weight:700; text-align:center; }
    .calendar-cell { position:relative; width:100%; height:100%; min-width:0; min-height:0; align-self:stretch; justify-self:stretch; margin:0; padding:5px; overflow:hidden; appearance:none; display:flex; align-items:flex-start; justify-content:flex-start; text-align:left; vertical-align:top; background:transparent; border:1px solid #F7F9FA; border-radius:9px; outline:2px solid transparent; outline-offset:-2px; }
    button.calendar-cell { cursor:pointer; }
    .calendar-cell.quest { background:var(--q-tint); border-color:transparent; }
    .calendar-cell.photo { background-position:center; background-size:cover; border-color:transparent; }
    .calendar-cell.today { outline-color:var(--action); }
    .today-ring { position:absolute; inset:0; border-radius:9px; outline:2px solid var(--action); outline-offset:-2px; pointer-events:none; }
    .calendar-cell.today:has(.today-ring) { outline-color:transparent; }
    .calendar-cell.outside { opacity:.3; }
    .calendar-cell.future { opacity:.35; }
    .cell-number { display:inline-flex; min-height:16px; align-items:center; padding:2px 5px; color:var(--done); border-radius:999px; font-size:9px; font-weight:700; line-height:1; }
    .calendar-cell.photo .cell-number { color:var(--text); background:rgba(255,255,255,.82); }
    .cell-q { position:absolute; left:6px; bottom:6px; width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center; color:#FFFFFF; background:var(--q); border-radius:5px; font-size:10px; font-weight:800; line-height:1; }

    .detail { min-height:0; display:flex; flex:1; flex-direction:column; gap:10px; }
    .detail-head { min-height:30px; justify-content:space-between; gap:10px; }
    .back-button { min-height:30px; padding:0 4px; color:var(--secondary); background:transparent; border:0; font-size:11px; font-weight:700; cursor:pointer; }
    .detail-grid { min-height:0; display:grid; flex:1; grid-template-columns:minmax(180px,34%) minmax(0,1fr); gap:14px; }
    .detail-visual { min-height:0; overflow:hidden; background:var(--q-tint); border:1px solid #F1F5F7; border-radius:12px; }
    .detail-visual.photo { background-color:var(--p-tint); background-position:center; background-size:cover; }
    .detail-copy { min-width:0; min-height:0; display:flex; flex-direction:column; gap:9px; }
    .detail-meta { flex-wrap:wrap; gap:6px; }
    .detail-date { font-size:13px; font-weight:800; }
    .mode-pill { display:inline-flex; align-items:center; gap:5px; padding:4px 8px 4px 5px; color:var(--title); border-radius:999px; font-size:10px; font-weight:800; letter-spacing:.06em; }
    .mode-pill.q { background:var(--q-tint); }
    .mode-pill.p { background:var(--p-tint); }
    .mode-mark { width:15px; height:15px; display:inline-flex; align-items:center; justify-content:center; color:#FFFFFF; border-radius:5px; font-size:9px; font-weight:800; line-height:1; }
    .q .mode-mark { background:var(--q); }
    .p .mode-mark { background:var(--p); }
    .temperature-pill { display:inline-flex; padding:4px 8px; color:var(--action); background:var(--action-soft); border-radius:999px; font-size:10px; font-weight:700; }
    .pills { display:flex; min-width:0; flex-wrap:nowrap; gap:5px; overflow:hidden; }
    .pill { flex:0 0 auto; padding:4px 8px; color:var(--secondary); background:#F5F9FB; border-radius:999px; font-size:10px; font-weight:700; }
    .detail-sections { min-height:0; display:flex; flex:1; flex-direction:column; gap:8px; overflow-y:auto; }
    .detail-section { display:flex; flex-direction:column; gap:5px; }
    .detail-section + .detail-section { padding-top:8px; border-top:1px solid #F1F5F7; }
    .section-head { justify-content:space-between; gap:8px; }
    .label { color:var(--secondary); font-size:10px; font-weight:800; letter-spacing:.06em; }
    .count { color:var(--muted); font-size:10px; font-weight:800; }
    .job { font-size:12px; font-weight:700; }
    .detail-item { min-height:30px; display:flex; align-items:center; gap:7px; padding:6px 8px; background:#FFFFFF; border-radius:9px; box-shadow:0 1px 2px rgba(18,48,60,.05); }
    .state-dot { width:9px; height:9px; flex:0 0 auto; background:#FFFFFF; border:1.5px solid #C6D6DD; border-radius:50%; }
    .detail-item.done .state-dot { background:#C6D6DD; }
    .item-text { font-size:11px; font-weight:600; line-height:1.4; }
    .detail-item.done .item-text { color:var(--done); text-decoration:line-through; }
    .quote { padding-left:9px; border-left:2px solid #CFE2EA; }
    .body-text { margin:0; font-size:12px; font-weight:600; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; }
    .choice { margin-top:4px; color:var(--action); font-size:11px; font-weight:700; }
    .achievement-pill { background:#FFFFFF; border:1px solid #E6EDF0; }
    .photo-thumbs { display:flex; gap:6px; overflow-x:auto; }
    .photo-thumb { width:54px; height:54px; flex:0 0 auto; padding:0; overflow:hidden; background:#FFFFFF; border:1px solid #E6EDF0; border-radius:9px; cursor:pointer; }
    .photo-thumb.active { outline:2px solid var(--action); outline-offset:-2px; }
    .photo-thumb img { width:100%; height:100%; object-fit:cover; }
    .record-nav { justify-content:flex-end; gap:5px; margin-top:auto; }
    .record-button { width:32px; height:32px; padding:0; color:var(--secondary); background:#FFFFFF; border:1px solid #DCE7ED; border-radius:8px; cursor:pointer; }
    .record-button:disabled { color:var(--done); cursor:default; }
    @media (max-width:639px) {
      .widget { padding:14px; }
      .detail-grid { display:flex; flex-direction:column; }
      .detail-visual { min-height:120px; flex:0 0 120px; }
      .month-button, .back-button, .record-button { min-height:40px; }
    }
  </style>
  <link rel="stylesheet" href="../widget-frame.css">
</head>
<body class="widget-page widget-page-centered">
  <main class="shell widget-host" data-widget-host data-widget-key="widget-size-calendar.html" data-widget-max-width="940" data-widget-height="546" style="--widget-max-width:940px;--widget-base-width:940px;--widget-base-height:546px;--widget-visual-height:546px">
    <section class="widget" data-widget-card aria-label="게임 로그 일기 캘린더 위젯">
      <div class="widget-dynamic-content" id="app"></div>
      <span class="widget-size-label" data-widget-size-label aria-hidden="true"></span>
      <button class="widget-size-handle" data-widget-scale-handle type="button" aria-label="위젯 비율 고정 크기 조절" aria-valuemin="70" aria-valuemax="100"></button>
    </section>
  </main>
  <script src="../store.js"></script>
  <script>
    (() => {
      'use strict';
      const WEEKDAYS=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
      const MOOD_NAMES=['차가움','서늘함','보통','포근함','따뜻함'];
      const app=document.getElementById('app');
      function localKey(date){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');return `${y}-${m}-${d}`;}
      function fromKey(key){const [y,m,d]=key.split('-').map(Number);return new Date(y,m-1,d,12);}
      function formatDate(key){const d=fromKey(key);return `${d.getMonth()+1}월 ${d.getDate()}일 ${WEEKDAYS[d.getDay()]}`;}
      function escapeHtml(value){return String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');}
      function moodValue(value){const n=Number(value);return Number.isInteger(n)&&n>=1&&n<=5?n:null;}
      function cleanWords(value){return [...new Set((Array.isArray(value)?value:[]).map(item=>String(item).trim()).filter(Boolean))];}
      let TODAY=localKey(new Date());
      let store={entries:{}};
      const now=new Date();
      const ui={view:'calendar',year:now.getFullYear(),month:now.getMonth(),selectedDate:null,selectedPhoto:0};
      function entryMood(entry){return{mood:moodValue(entry?.mood??entry?.quest?.mood),tags:cleanWords(entry?.quest?.moodTags)};}
      function modePill(mode){const quest=mode==='quest';return `<span class="mode-pill ${quest?'q':'p'}"><span class="mode-mark">${quest?'Q':'P'}</span>${quest?'퀘스트':'일기'}</span>`;}
      function calendarDates(){const first=new Date(ui.year,ui.month,1,12),last=new Date(ui.year,ui.month+1,0,12),offset=(first.getDay()+6)%7,total=Math.ceil((offset+last.getDate())/7)*7,start=new Date(ui.year,ui.month,1-offset,12);return Array.from({length:total},(_,index)=>{const date=new Date(start);date.setDate(start.getDate()+index);return{date,key:localKey(date),inside:date.getMonth()===ui.month};});}
      async function sync(){try{const dates=calendarDates(),rows=await Store.loadDiaryRange(dates[0].key,dates.at(-1).key);store={entries:Object.fromEntries((Array.isArray(rows)?rows:[]).map(entry=>[entry.date,entry]))};if(ui.view==='detail'&&!store.entries[ui.selectedDate]){ui.view='calendar';ui.selectedDate=null;}render();}catch(_){app.innerHTML='<section class="empty-block"><div class="empty-title">불러오기 실패</div><div class="empty-copy">잠시 후 다시 열어주세요</div></section>';}}
      window.addEventListener('focus',sync);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync();});Store.watch(sync);
      function photoStyle(entry){return entry?.mode==='photo'&&entry.images?.[0]?` style="background-image:url('${escapeHtml(entry.images[0])}')"`:'';}
      function renderCalendar(animate=false){const monthPrefix=`${ui.year}-${String(ui.month+1).padStart(2,'0')}`,count=Object.keys(store.entries).filter(key=>key.startsWith(monthPrefix)).length,dates=calendarDates(),cells=dates.map(({date,key,inside})=>{const item=store.entries[key],tag=item?'button':'div',classes=['calendar-cell',inside?'':'outside',key>TODAY?'future':'',item?.mode||'',key===TODAY?'today':''].filter(Boolean).join(' ');return `<${tag} class="${classes}"${item?` type="button" data-entry-date="${key}"`:''}${photoStyle(item)}><span class="cell-number">${date.getDate()}</span>${item?.mode==='quest'?'<span class="cell-q">Q</span>':''}${key===TODAY?'<span class="today-ring" aria-hidden="true"></span>':''}</${tag}>`;}).join('');app.innerHTML=`<header class="calendar-head"><div class="month-controls"><button class="month-button" type="button" data-month="-1" aria-label="이전 달">‹</button><div class="month-title">${ui.year}년 ${ui.month+1}월</div><button class="month-button" type="button" data-month="1" aria-label="다음 달">›</button></div><div class="record-count">${count}편 기록</div></header><section class="calendar-wrap${animate?' motion-calendar-swap':''}"><div class="weekday-grid">${['월','화','수','목','금','토','일'].map(day=>`<div class="weekday">${day}</div>`).join('')}</div><div class="calendar-grid" style="grid-template-rows:repeat(${dates.length/7},minmax(0,1fr))">${cells}</div></section>`;}
      function itemRows(items){return (Array.isArray(items)?items:[]).map(item=>`<div class="detail-item${item.done?' done':''}"><span class="state-dot"></span><span class="item-text">${escapeHtml(item.t)}</span></div>`).join('');}
      function questDetails(entry){const q=entry.quest||{},parts=[];if(q.job?.trim())parts.push(`<section class="detail-section"><div class="job">${escapeHtml(q.job)}</div></section>`);if(q.conds?.length)parts.push(`<section class="detail-section"><div class="pills">${cleanWords(q.conds).map(item=>`<span class="pill">${escapeHtml(item)}</span>`).join('')}</div></section>`);if(q.main?.length){const done=q.main.filter(item=>item.done).length;parts.push(`<section class="detail-section"><div class="section-head"><div class="label">오늘의 퀘스트</div><div class="count">${done} / ${q.main.length}</div></div>${itemRows(q.main)}</section>`);}if(q.sub?.length)parts.push(`<section class="detail-section"><div class="label">서브 퀘스트</div>${itemRows(q.sub)}</section>`);if(q.event?.t?.trim()||q.event?.c?.trim())parts.push(`<section class="detail-section"><div class="label">발생한 이벤트</div><div class="quote">${q.event.t?.trim()?`<p class="body-text">${escapeHtml(q.event.t)}</p>`:''}${q.event.c?.trim()?`<div class="choice">→ ${escapeHtml(q.event.c)}</div>`:''}</div></section>`);if(q.achieve?.length)parts.push(`<section class="detail-section"><div class="label">오늘의 업적</div><div class="pills">${q.achieve.map(item=>`<span class="pill achievement-pill">${escapeHtml(item)}</span>`).join('')}</div></section>`);if(q.ending?.trim())parts.push(`<section class="detail-section"><div class="label">하루 엔딩로그</div><div class="quote"><p class="body-text">${escapeHtml(q.ending)}</p></div></section>`);return parts.join('');}
      function renderDetail(){const entry=store.entries[ui.selectedDate];if(!entry){ui.view='calendar';renderCalendar();return;}const keys=Object.keys(store.entries).sort(),index=keys.indexOf(ui.selectedDate),photos=entry.mode==='photo'?(entry.images||[]):[],mood=entryMood(entry),visual=entry.mode==='photo'&&photos.length?`<div class="detail-visual photo" style="background-image:url('${escapeHtml(photos[ui.selectedPhoto]||photos[0])}')"></div>`:'<div class="detail-visual"></div>',moodLine=`${mood.mood?`<span class="temperature-pill">온도 · ${MOOD_NAMES[mood.mood-1]}</span>`:''}${mood.tags.length?`<div class="pills">${mood.tags.map(tag=>`<span class="pill">${escapeHtml(tag)}</span>`).join('')}</div>`:''}`,content=entry.mode==='photo'?`<div class="detail-sections">${entry.quest?.text?.trim()?`<p class="body-text">${escapeHtml(entry.quest.text)}</p>`:''}${photos.length>1?`<div class="photo-thumbs">${photos.map((src,i)=>`<button class="photo-thumb${i===ui.selectedPhoto?' active':''}" type="button" data-photo-index="${i}"><img src="${escapeHtml(src)}" alt=""></button>`).join('')}</div>`:''}</div>`:`<div class="detail-sections">${questDetails(entry)}</div>`;app.innerHTML=`<section class="detail"><header class="detail-head"><button class="back-button" type="button" data-back>‹ 달력으로</button><div class="detail-index">${index+1} / ${keys.length}</div></header><div class="detail-grid">${visual}<div class="detail-copy"><div class="mode-line">${modePill(entry.mode)}<span class="detail-date">${formatDate(ui.selectedDate)}</span></div>${moodLine?`<div class="detail-meta">${moodLine}</div>`:''}${content}<div class="record-nav"><button class="record-button" type="button" data-record-nav="-1"${keys.length<2?' disabled':''}>‹</button><button class="record-button" type="button" data-record-nav="1"${keys.length<2?' disabled':''}>›</button></div></div></div></section>`;}
      function render(){ui.view==='detail'?renderDetail():renderCalendar();}
      function scheduleTodayRollover(){const current=new Date(),next=new Date(current.getFullYear(),current.getMonth(),current.getDate()+1,0,0,1);setTimeout(()=>{const nextToday=localKey(new Date());if(nextToday!==TODAY){TODAY=nextToday;render();}scheduleTodayRollover();},next-current);}
      app.addEventListener('click',async event=>{const target=event.target,month=target.closest('[data-month]');if(month){const date=new Date(ui.year,ui.month+Number(month.dataset.month),1,12);ui.year=date.getFullYear();ui.month=date.getMonth();renderCalendar(true);await sync();return;}const cell=target.closest('[data-entry-date]');if(cell){ui.selectedDate=cell.dataset.entryDate;ui.selectedPhoto=0;ui.view='detail';renderDetail();return;}if(target.closest('[data-back]')){ui.view='calendar';renderCalendar();return;}const photo=target.closest('[data-photo-index]');if(photo){ui.selectedPhoto=Number(photo.dataset.photoIndex);renderDetail();return;}const nav=target.closest('[data-record-nav]');if(nav){const keys=Object.keys(store.entries).sort();if(keys.length<2)return;const current=keys.indexOf(ui.selectedDate),next=(current+Number(nav.dataset.recordNav)+keys.length)%keys.length;ui.selectedDate=keys[next];ui.selectedPhoto=0;const date=fromKey(ui.selectedDate);ui.year=date.getFullYear();ui.month=date.getMonth();renderDetail();}});
      render();sync();scheduleTodayRollover();
    })();
  </script>
  <script src="../widget-frame.js"></script>
</body>
</html>

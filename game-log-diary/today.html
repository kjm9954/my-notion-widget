<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게임 로그 일기 · 오늘</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root {
      --action:#0E5C7A; --action-soft:#E2F0F6; --text:#12303C; --title:#33505C;
      --secondary:#6B8794; --muted:#93A5AD; --faint:#A2B4BC; --done:#A9BAC2;
      --q:oklch(0.62 0.09 245); --q-tint:oklch(0.975 0.017 245);
      --p:oklch(0.62 0.09 195); --p-tint:oklch(0.975 0.017 195);
    }
    * { box-sizing:border-box; }
    html, body { min-height:100%; background:transparent; }
    body { margin:0; color:var(--text); font-family:"Pretendard Variable",-apple-system,"Helvetica Neue",sans-serif; -webkit-font-smoothing:antialiased; }
    button, input, textarea { font:inherit; }
    button { color:inherit; }
    .shell { min-height:0; }
    .widget { width:100%; height:720px; display:flex; flex-direction:column; padding:18px; overflow:hidden; background:#FFFFFF; border-radius:18px; box-shadow:0 1px 2px rgba(18,48,60,.04),0 6px 18px rgba(18,48,60,.06); }
    #app { min-height:0; display:flex; flex:1; flex-direction:column; gap:10px; }
    .header, .date-line, .section-head, .stat-row, .button-row, .editor-head, .mood-label, .custom-row { display:flex; align-items:center; }
    .header { min-height:26px; gap:8px; }
    .date-line { min-width:0; gap:7px; }
    .date-title { font-size:13px; font-weight:800; }
    .temperature-pill, .streak { display:inline-flex; align-items:center; padding:4px 8px; color:var(--action); background:var(--action-soft); border-radius:999px; font-size:10px; font-weight:700; white-space:nowrap; }
    .edit-button, .text-button { padding:0; color:var(--muted); background:transparent; border:0; font-size:10px; font-weight:700; cursor:pointer; }
    .header-actions { display:flex; align-items:center; gap:9px; margin-left:auto; }
    .write-today { color:var(--action); }
    .delete-action, .delete-confirm-copy { color:#A56B6B; }
    .delete-confirm-copy { font-size:10px; font-weight:700; }
    .confirm-delete, .cancel-delete { min-height:28px; padding:0 8px; border-radius:8px; font-size:10px; font-weight:700; cursor:pointer; }
    .confirm-delete { color:#FFFFFF; background:#A56B6B; border:1px solid #A56B6B; }
    .cancel-delete { color:var(--secondary); background:#FFFFFF; border:1px solid #DCE7ED; }
    .entry-block { min-height:0; display:flex; flex:1; flex-direction:column; gap:8px; padding:11px; overflow-x:hidden; overflow-y:auto; background:#FAFCFD; border:1px solid #E6EDF0; border-radius:12px; }
    .empty-block { min-height:0; display:flex; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:34px 16px; text-align:center; background:#FAFCFD; border:1px dashed #C6D6DD; border-radius:12px; }
    .empty-title { color:var(--title); font-size:13px; font-weight:800; }
    .empty-copy { color:var(--muted); font-size:11px; font-weight:600; }
    .empty-actions { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:4px; }
    .primary, .secondary-button { min-height:34px; padding:0 13px; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer; }
    .primary { color:#FFFFFF; background:var(--action); border:1px solid var(--action); }
    .secondary-button { color:var(--secondary); background:#FFFFFF; border:1px solid #DCE7ED; }
    .quest-section, .photo-view { display:flex; flex-direction:column; gap:6px; }
    .quest-section + .quest-section, .photo-view > * + * { padding-top:8px; border-top:1px solid #F1F5F7; }
    .section-head { justify-content:space-between; gap:8px; }
    .label { color:var(--secondary); font-size:10px; font-weight:800; letter-spacing:.06em; }
    .count { color:var(--muted); font-size:10px; font-weight:800; }
    .job { color:var(--text); font-size:12px; font-weight:700; }
    .pills { display:flex; flex-wrap:wrap; gap:5px; }
    .pill { display:inline-flex; align-items:center; padding:4px 8px; color:var(--secondary); background:#F5F9FB; border-radius:999px; font-size:10px; font-weight:700; }
    .achievement-pill { background:#FFFFFF; border:1px solid #E6EDF0; }
    .quest-list { display:flex; flex-direction:column; gap:4px; }
    .quest-item { width:100%; min-height:32px; display:flex; align-items:center; gap:8px; padding:8px 9px; text-align:left; background:#FFFFFF; border:0; border-radius:9px; box-shadow:0 1px 2px rgba(18,48,60,.05); cursor:pointer; }
    .state-dot { width:9px; height:9px; flex:0 0 auto; background:#FFFFFF; border:1.5px solid #C6D6DD; border-radius:50%; }
    .quest-item.done .state-dot { background:#C6D6DD; }
    .quest-item-text { min-width:0; color:var(--text); font-size:11px; font-weight:600; line-height:1.4; overflow-wrap:anywhere; }
    .quest-item.done .quest-item-text { color:var(--done); text-decoration:line-through; }
    .quote { padding-left:9px; border-left:2px solid #CFE2EA; }
    .body-text { margin:0; color:var(--text); font-size:12px; font-weight:600; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; }
    .choice { margin-top:4px; color:var(--action); font-size:11px; font-weight:700; }
    .thumb-row { display:grid; grid-template-columns:minmax(0,1fr); gap:7px; overflow:visible; }
    .view-thumb { width:100%; height:auto; display:block; object-fit:contain; border:1px solid #E6EDF0; border-radius:9px; }
    .stats { flex:0 0 auto; padding:9px 10px; background:#FAFCFD; border:1px solid #F1F5F7; border-radius:12px; }
    .stat-row { gap:8px; }
    .hp-label { color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.06em; }
    .hp-value { color:var(--secondary); font-size:11px; font-weight:700; }
    .hp-track { height:5px; min-width:60px; max-width:220px; flex:1; overflow:hidden; background:#EDF2F4; border-radius:3px; }
    .hp-fill { display:block; height:100%; background:var(--action); border-radius:3px; transition:width var(--t-gauge) var(--ease); }
    .streak { margin-left:auto; }

    .editor { width:100%; max-width:800px; min-height:0; display:flex; flex:1; flex-direction:column; gap:10px; margin:0 auto; }
    .editor-head { min-height:26px; gap:7px; }
    .editor-date { font-size:13px; font-weight:800; }
    .editor-date-input { width:142px; min-height:30px; padding:0 8px; color:var(--text); background:#FFFFFF; border:1px solid #DCE7ED; border-radius:8px; font-size:11px; font-weight:700; }
    .editor-head .text-button { margin-left:auto; }
    .mode-pill { display:inline-flex; align-items:center; gap:5px; padding:4px 8px 4px 5px; color:var(--title); border-radius:999px; font-size:10px; font-weight:800; letter-spacing:.06em; }
    .mode-pill.q { background:var(--q-tint); }
    .mode-pill.p { background:var(--p-tint); }
    .mode-mark { width:15px; height:15px; display:inline-flex; align-items:center; justify-content:center; color:#FFFFFF; border-radius:5px; font-size:9px; font-weight:800; line-height:1; }
    .q .mode-mark { background:var(--q); }
    .p .mode-mark { background:var(--p); }
    .progress { display:flex; gap:4px; }
    .progress-part { height:4px; flex:1; background:#EDF2F4; border-radius:2px; }
    .progress-part.active { background:var(--action); }
    .question { display:flex; flex-direction:column; gap:3px; }
    .question-title { font-size:15px; font-weight:800; }
    .hint { color:var(--muted); font-size:11px; font-weight:600; }
    .step-body { min-height:0; display:flex; flex:1; flex-direction:column; gap:9px; overflow-x:hidden; overflow-y:auto; }
    .field, .textarea, .list-input, .custom-input { width:100%; color:var(--text); outline:none; border-radius:9px; font-size:12px; font-weight:600; }
    .field, .textarea { padding:9px 10px; background:#FFFFFF; border:1px solid #E1EAEE; }
    .textarea { min-height:82px; resize:vertical; line-height:1.55; }
    .field:focus, .textarea:focus, .list-input:focus, .custom-input:focus { border-color:var(--action); }
    .mood-box { display:flex; flex-direction:column; gap:8px; padding:9px; background:#FAFCFD; border:1px solid #F1F5F7; border-radius:12px; }
    .word-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px; }
    .word-grid.photo { grid-template-columns:repeat(4,minmax(0,1fr)); }
    .word-button { min-width:0; height:32px; padding:0 7px; overflow:hidden; color:var(--secondary); background:#FFFFFF; border:1px solid #E1EAEE; border-radius:8px; font-size:11px; font-weight:700; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; transition:background-color var(--t-color) var(--ease), border-color var(--t-color) var(--ease), color var(--t-color) var(--ease); }
    .word-grid.photo .word-button { height:30px; }
    .word-button.active { color:#FFFFFF; background:var(--action); border-color:var(--action); }
    .custom-row { min-height:24px; gap:7px; }
    .custom-toggle { padding:0; color:var(--muted); background:transparent; border:0; font-size:10px; font-weight:700; cursor:pointer; }
    .selected-count { margin-left:auto; color:var(--faint); font-size:9px; font-weight:700; }
    .custom-input { height:30px; padding:0 8px; background:#FFFFFF; border:1px solid #E1EAEE; }
    .temperature { display:flex; flex-direction:column; gap:6px; padding-top:8px; border-top:1px solid #F1F5F7; }
    .mood-label { justify-content:space-between; gap:8px; }
    .mood-caption { color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.06em; }
    .mood-name { min-height:15px; color:var(--action); font-size:12px; font-weight:800; }
    .temperature-track { display:flex; gap:4px; }
    .temperature-part { height:30px; flex:1; padding:0; background:#FFFFFF; border:1px solid #E1EAEE; border-radius:8px; cursor:pointer; transition:background-color var(--t-color) var(--ease), border-color var(--t-color) var(--ease); }
    .temperature-part.before { background:var(--action-soft); border-color:#CFE2EA; }
    .temperature-part.active { background:var(--action); border-color:var(--action); }
    .temperature-ends { display:flex; justify-content:space-between; color:var(--done); font-size:9px; font-weight:700; }
    .draft-list { display:flex; flex-direction:column; gap:4px; }
    .draft-item { min-height:34px; display:flex; align-items:center; gap:8px; padding:6px 9px; background:#FFFFFF; border-radius:9px; box-shadow:0 1px 2px rgba(18,48,60,.05); }
    .draft-title { min-width:0; flex:1; overflow-wrap:anywhere; font-size:11px; font-weight:600; }
    .remove-item { width:28px; height:28px; padding:0; color:var(--muted); background:transparent; border:0; border-radius:8px; cursor:pointer; }
    .list-input { padding:9px 10px; background:#FAFCFD; border:1px dashed #C6D6DD; }
    .list-help, .photo-help { color:var(--faint); font-size:10px; font-weight:600; }
    .button-row { flex:0 0 auto; gap:7px; }
    .button-spacer { flex:1; }
    .photo-label { color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.06em; }
    .photo-slots { display:flex; flex-wrap:wrap; align-items:flex-start; gap:7px; overflow:visible; }
    .photo-slot-wrap { width:300px; display:block; flex:0 0 auto; }
    .photo-slot, .add-photo { width:300px; flex:0 0 auto; border-radius:9px; }
    .photo-slot { position:relative; overflow:hidden; border:1px solid #E6EDF0; }
    .photo-slot img { width:100%; height:auto; display:block; object-fit:contain; }
    .remove-photo { position:absolute; top:4px; right:4px; width:22px; height:22px; padding:0; color:#FFFFFF; background:rgba(18,48,60,.62); border:0; border-radius:999px; cursor:pointer; }
    .add-photo { position:relative; height:120px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--secondary); background:#FAFCFD; border:1px dashed #C6D6DD; font-size:10px; font-weight:700; cursor:pointer; }
    .photo-slots .add-photo:only-child { width:100%; height:96px; }
    .add-photo span:first-child { color:var(--muted); font-size:18px; line-height:1; }
    .add-photo input { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; }
    @media (max-width:639px) {
      .widget { padding:14px; }
      .word-grid.photo { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .button-row { flex-wrap:wrap; }
      .button-spacer { display:none; }
      .primary, .secondary-button { min-height:40px; }
      .header-actions { flex-wrap:wrap; justify-content:flex-end; }
      .photo-slot-wrap, .photo-slot, .add-photo { width:100%; }
    }
  </style>
  <link rel="stylesheet" href="../widget-frame.css">
  <script src="../store.js"></script>
</head>
<body class="widget-page widget-page-centered">
  <main class="shell widget-host" data-widget-host data-widget-key="widget-size-today.html" data-widget-width-key="widget-width-game-log-diary-v1" data-widget-max-width="940" data-widget-height="720" style="--widget-max-width:940px;--widget-base-width:940px;--widget-base-height:720px;--widget-visual-height:720px">
    <section class="widget" data-widget-card aria-label="게임 로그 일기 오늘 위젯">
      <div class="widget-dynamic-content" id="app"></div>
      <span class="widget-size-label" data-widget-size-label aria-hidden="true"></span>
      <button class="widget-size-handle" data-widget-scale-handle type="button" aria-label="위젯 비율 고정 크기 조절" aria-valuemin="70" aria-valuemax="100"></button>
    </section>
  </main>
  <script>
    (() => {
      'use strict';
      const WEEKDAYS=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
      const PRESET_WORDS=['뿌듯함','평온','설렘','지루함','초조함','서운함','고단함','멍함'];
      const MOOD_NAMES=['차가움','서늘함','보통','포근함','따뜻함'];
      const app=document.getElementById('app');

      function localKey(date){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');return `${y}-${m}-${d}`;}
      function fromKey(key){const [y,m,d]=key.split('-').map(Number);return new Date(y,m-1,d,12);}
      function addDays(date,amount){const next=new Date(date);next.setDate(next.getDate()+amount);return next;}
      function formatDate(key){const d=fromKey(key);return `${d.getMonth()+1}월 ${d.getDate()}일 ${WEEKDAYS[d.getDay()]}`;}
      function escapeHtml(value){return String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');}
      function clone(value){return JSON.parse(JSON.stringify(value));}
      function moodValue(value){const n=Number(value);return Number.isInteger(n)&&n>=1&&n<=5?n:null;}
      function cleanWords(value){return [...new Set((Array.isArray(value)?value:[]).map(word=>String(word).trim()).filter(Boolean))];}
      function emptyQuest(){return {mood:null,moodTags:[],main:[],sub:[],event:{t:'',c:''},achieve:[],ending:'',job:'',conds:[]};}
      function normalizeQuest(value){const base=emptyQuest(),q=value&&typeof value==='object'?value:{};return {...base,...q,mood:moodValue(q.mood),moodTags:cleanWords(q.moodTags),main:Array.isArray(q.main)?q.main:[],sub:Array.isArray(q.sub)?q.sub:[],event:q.event&&typeof q.event==='object'?q.event:base.event,achieve:Array.isArray(q.achieve)?q.achieve:[],job:String(q.job??''),conds:cleanWords(q.conds),ending:String(q.ending??'')};}
      function normalizeDiary(value){if(!value||typeof value!=='object'||!['quest','photo'].includes(value.mode))return null;const payload=value.quest&&typeof value.quest==='object'?value.quest:{};if(value.mode==='photo')return{mode:'photo',photos:Array.isArray(value.images)?value.images:[],text:String(payload.text??''),mood:moodValue(value.mood),moodTags:cleanWords(payload.moodTags)};const q=normalizeQuest({...payload,mood:moodValue(value.mood??payload.mood),achieve:Array.isArray(value.achievements)?value.achievements:payload.achieve});return{mode:'quest',quest:q};}
      function diaryPayload(date,entry){if(entry.mode==='photo')return{date,mode:'photo',mood:moodValue(entry.mood),achievements:[],images:Array.isArray(entry.photos)?[...entry.photos]:[],quest:{text:String(entry.text??''),moodTags:cleanWords(entry.moodTags)}};const q=normalizeQuest(entry.quest);return{date,mode:'quest',mood:q.mood,achievements:[...q.achieve],images:[],quest:clone(q)};}
      let store={entries:{}};
      let writtenDates=[];
      let currentHp=20;
      let customWords=[];
      let moodByDate={};
      let requestMessage='';
      let busy=false;
      let loadSequence=0;
      function initialDate(){try{const key=new URLSearchParams(location.search).get('date');if(key&&/^\d{4}-\d{2}-\d{2}$/.test(key)&&localKey(fromKey(key))===key)return key;}catch(_){}return localKey(new Date());}
      const TODAY=localKey(new Date());
      const ui={screen:'home',selectedDate:initialDate(),originalDate:null,questStep:1,questDraft:null,photoDraft:null,pending:{2:'',3:'',5:''},wordInputOpen:false,showTodayComposer:false,confirmingDeleteDate:null,sharedMood:{mood:null,moodTags:[]}};
      let lastRenderedHp=null;
      let initialSwap=new URLSearchParams(location.search).get('motion')==='swap';
      let justSaved=false;
      function entryMood(entry){return entry?.mode==='quest'?{mood:moodValue(entry.quest?.mood),moodTags:cleanWords(entry.quest?.moodTags)}:{mood:moodValue(entry?.mood),moodTags:cleanWords(entry?.moodTags)};}
      function syncShared(source){ui.sharedMood={mood:moodValue(source?.mood),moodTags:cleanWords(source?.moodTags)};}
      function applyShared(target){target.mood=ui.sharedMood.mood;target.moodTags=[...ui.sharedMood.moodTags];}
      function currentDraft(){return ui.screen==='quest'?ui.questDraft:ui.photoDraft;}
      function isEditing(){return ui.screen==='quest'||ui.screen==='photo';}
      function requestStatus(){return requestMessage?`<span class="hint" role="status">${escapeHtml(requestMessage)}</span>`:'';}
      function renderLoading(){app.innerHTML='<section class="empty-block" aria-busy="true"><div class="empty-title">불러오는 중</div><div class="empty-copy">잠시만 기다려주세요</div></section>';}
      function renderFailure(message){app.innerHTML=`<section class="empty-block"><div class="empty-title">${escapeHtml(message)}</div><div class="empty-copy">네트워크 연결을 확인해주세요</div><div class="empty-actions"><button class="secondary-button" type="button" data-retry>다시 시도</button></div></section>`;}
      function streakFromDates(){const set=new Set(writtenDates);let streak=0,cursor=fromKey(TODAY);while(set.has(localKey(cursor))){streak++;cursor=addDays(cursor,-1);}return streak;}
      function latestPastDate(){return writtenDates.filter(key=>key<TODAY).sort().at(-1)||null;}
      function homeDataSignature(entries=store.entries,dates=writtenDates,hp=currentHp,words=customWords,moods=moodByDate){return JSON.stringify({dates:[...dates].sort(),hp,words,rows:Object.keys(entries).sort().map(date=>[date,entries[date],moods[date]??null])});}
      async function loadHomeData(showLoading=true,forceRender=showLoading){
        if(!window.Store){renderFailure('저장소를 불러오지 못했습니다');return;}
        const loadId=++loadSequence,blocking=showLoading;
        if(showLoading&&!isEditing())renderLoading();
        if(blocking)busy=true;
        try{
          const [dates,hp,words]=await Promise.all([Store.getWrittenDates(),Store.getHP(),Store.loadMoodWords()]);
          const nextWrittenDates=Array.isArray(dates)?[...new Set(dates.filter(key=>/^\d{4}-\d{2}-\d{2}$/.test(key)))].sort():[];
          const nextHp=Number.isFinite(Number(hp))?Number(hp):20;
          const nextWords=cleanWords(words).filter(word=>!PRESET_WORDS.includes(word)).slice(0,16);
          const fallback=ui.selectedDate===TODAY&&!ui.showTodayComposer&&!nextWrittenDates.includes(TODAY)?nextWrittenDates.filter(key=>key<TODAY).at(-1)||null:null;
          const targetDates=[...new Set([ui.selectedDate,fallback].filter(Boolean))];
          const rows=await Promise.all(targetDates.map(async date=>{const [diary,mood]=await Promise.all([Store.loadDiary(date),Store.getMoodOfDate(date)]);return{date,entry:normalizeDiary(diary),mood:moodValue(mood)};}));
          if(loadId!==loadSequence||(!forceRender&&(busy||isEditing()||ui.confirmingDeleteDate)))return;
          const nextEntries={},nextMoods={};
          rows.forEach(({date,entry,mood})=>{if(entry)nextEntries[date]=entry;nextMoods[date]=mood;});
          const changed=homeDataSignature()!==homeDataSignature(nextEntries,nextWrittenDates,nextHp,nextWords,nextMoods);
          writtenDates=nextWrittenDates;currentHp=nextHp;customWords=nextWords;store={entries:nextEntries};moodByDate=nextMoods;requestMessage='';
          if(blocking)busy=false;
          if(!isEditing()&&(forceRender||changed))render();
        }catch(_){
          if(loadId!==loadSequence)return;
          if(blocking)busy=false;
          requestMessage='';
          if(isEditing()){requestMessage='불러오기 실패, 다시 시도';render();}
          else if(showLoading||forceRender)renderFailure('불러오기 실패, 다시 시도');
        }
      }
      function refreshHomeData(){if(!busy&&!isEditing()&&!ui.confirmingDeleteDate)return loadHomeData(false);}
      window.addEventListener('focus',refreshHomeData);
      Store.watch(refreshHomeData);

      function modePill(mode){const quest=mode==='quest';return `<span class="mode-pill ${quest?'q':'p'}"><span class="mode-mark">${quest?'Q':'P'}</span>${quest?'퀘스트':'사진'}</span>`;}
      function temperaturePill(value){return value?`<span class="temperature-pill">온도 · ${MOOD_NAMES[value-1]}</span>`:'';}
      function moodPills(tags,conds=[]){const all=[...cleanWords(tags),...cleanWords(conds)];return all.length?`<div class="pills">${all.map(word=>`<span class="pill">${escapeHtml(word)}</span>`).join('')}</div>`:'';}
      function questItems(items,type,date){if(!items?.length)return'';return `<div class="quest-list">${items.map((item,index)=>`<button class="quest-item${item.done?' done':''}" type="button" data-toggle-task="${type}" data-index="${index}" data-date="${date}"><span class="state-dot"></span><span class="quest-item-text">${escapeHtml(item.t)}</span></button>`).join('')}</div>`;}
      function renderQuestEntry(entry,date){const q=normalizeQuest(entry.quest),parts=[];if(q.moodTags.length||q.conds.length)parts.push(`<section class="quest-section">${moodPills(q.moodTags,q.conds)}</section>`);if(q.job.trim())parts.push(`<section class="quest-section"><div class="job">${escapeHtml(q.job)}</div></section>`);if(q.main.length){const done=q.main.filter(item=>item.done).length;parts.push(`<section class="quest-section"><div class="section-head"><div class="label">오늘의 퀘스트 · ${done} / ${q.main.length}</div></div>${questItems(q.main,'main',date)}</section>`);}if(q.sub.length){parts.push(`<section class="quest-section"><div class="section-head"><div class="label">서브 퀘스트</div></div>${questItems(q.sub,'sub',date)}</section>`);}if(q.event.t?.trim()||q.event.c?.trim())parts.push(`<section class="quest-section"><div class="label">발생한 이벤트</div><div class="quote">${q.event.t?.trim()?`<p class="body-text">${escapeHtml(q.event.t)}</p>`:''}${q.event.c?.trim()?`<div class="choice">→ ${escapeHtml(q.event.c)}</div>`:''}</div></section>`);if(q.achieve.length)parts.push(`<section class="quest-section"><div class="label">오늘의 업적</div><div class="pills">${q.achieve.map(item=>`<span class="pill achievement-pill">${escapeHtml(item)}</span>`).join('')}</div></section>`);if(q.ending.trim())parts.push(`<section class="quest-section"><div class="label">하루 엔딩로그</div><div class="quote"><p class="body-text">${escapeHtml(q.ending)}</p></div></section>`);return parts.join('');}
      function renderEntry(entry,date){if(entry.mode==='photo'){const photos=Array.isArray(entry.photos)?entry.photos:[];const content=[];if(entry.moodTags?.length)content.push(`<section class="quest-section">${moodPills(entry.moodTags)}</section>`);if(photos.length)content.push(`<div class="thumb-row">${photos.map(src=>`<img class="view-thumb" src="${escapeHtml(src)}" alt="">`).join('')}</div>`);if(entry.text?.trim())content.push(`<p class="body-text">${escapeHtml(entry.text)}</p>`);return `<section class="entry-block"><div class="photo-view">${content.join('')}</div></section>`;}return `<section class="entry-block">${renderQuestEntry(entry,date)}</section>`;}
      function stats(){return{hp:currentHp,streak:streakFromDates()};}
      function renderStats(value,startHp=value.hp){return `<section class="stats"><div class="stat-row"><span class="hp-label">HP</span><span class="hp-value">${value.hp}</span><span class="hp-track"><span class="hp-fill" style="width:${startHp}%"></span></span><span class="streak">연속 ${value.streak}일</span></div></section>`;}
      function renderEmpty(){return `<section class="empty-block"><div class="empty-title">오늘의 로그가 비어 있습니다</div><div class="empty-copy">한 섹션만 쓰고 저장해도 됩니다</div><div class="empty-actions"><button class="primary" type="button" data-start="quest">퀘스트로 쓰기</button><button class="secondary-button" type="button" data-start="photo">사진으로 쓰기</button></div></section>`;}
      function homeSelection(){const direct=store.entries[ui.selectedDate];if(direct)return{entry:direct,date:ui.selectedDate,fallback:false};if(ui.selectedDate===TODAY&&!ui.showTodayComposer){const date=latestPastDate();if(date)return{entry:store.entries[date],date,fallback:true};}return{entry:null,date:ui.selectedDate,fallback:false};}
      function renderHome(){const selected=homeSelection(),mood=moodValue(moodByDate[selected.date]??entryMood(selected.entry).mood),confirming=ui.confirmingDeleteDate===selected.date,actions=selected.entry?(confirming?`<div class="header-actions"><span class="delete-confirm-copy">삭제할까요?</span><button class="confirm-delete" type="button" data-confirm-delete="${selected.date}"${busy?' disabled':''}>${busy?'삭제 중…':'삭제'}</button><button class="cancel-delete" type="button" data-cancel-delete${busy?' disabled':''}>취소</button></div>`:`<div class="header-actions"><button class="edit-button" type="button" data-edit-date="${selected.date}">수정</button><button class="edit-button delete-action" type="button" data-delete-request="${selected.date}">삭제</button>${selected.fallback?'<button class="edit-button write-today" type="button" data-write-today>오늘 쓰기</button>':''}</div>`):'',value=stats(),startHp=lastRenderedHp===null?value.hp:lastRenderedHp;lastRenderedHp=value.hp;app.innerHTML=`<header class="header"><div class="date-line"><span class="date-title">${formatDate(selected.date)}</span>${temperaturePill(mood)}</div>${requestStatus()}${actions}</header>${selected.entry?renderEntry(selected.entry,selected.date):renderEmpty()}${renderStats(value,startHp)}`;if(justSaved){widgetMotion.popIn(app.querySelector('.temperature-pill'));app.querySelectorAll('.achievement-pill').forEach(pill=>widgetMotion.popIn(pill));justSaved=false;}if(startHp!==value.hp)requestAnimationFrame(()=>{const fill=app.querySelector('.hp-fill');if(fill)fill.style.width=`${value.hp}%`;if(value.hp>startHp){const track=app.querySelector('.hp-track');const r=track.getBoundingClientRect();widgetMotion.spark(track,r.width*value.hp/100,r.height/2);}});if(initialSwap){app.classList.add('motion-swap');initialSwap=false;}}

      const STEPS=[['오늘을 단어로 고르면?','여러 개 골라도 되고, 안 골라도 됩니다'],['오늘의 퀘스트는?','꼭 해야 했던 일들'],['서브 퀘스트가 있었나요?','곁다리로 처리한 일들'],['오늘 발생한 이벤트는?','돌발 상황과 그때 고른 선택지'],['오늘의 업적은?','잘한 일, 작아도 괜찮습니다'],['하루 엔딩로그','마무리 한두 줄']];
      function allWords(){return cleanWords([...PRESET_WORDS,...customWords,...cleanWords(currentDraft()?.moodTags)]);}
      function wordGrid(tags,photo=false){return `<div class="word-grid${photo?' photo':''}">${allWords().map(word=>`<button class="word-button${tags.includes(word)?' active':''}" type="button" data-mood-word="${escapeHtml(word)}">${escapeHtml(word)}</button>`).join('')}</div>`;}
      function temperatureTrack(value){return `<div class="temperature"><div class="mood-label"><span class="mood-caption">오늘의 온도</span><span class="mood-name">${value?MOOD_NAMES[value-1]:''}</span></div><div class="temperature-track">${MOOD_NAMES.map((name,index)=>{const n=index+1;return `<button class="temperature-part${value&&n<value?' before':''}${value===n?' active':''}" type="button" data-mood-value="${n}" aria-label="${name}"></button>`;}).join('')}</div><div class="temperature-ends"><span>차가움</span><span>따뜻함</span></div></div>`;}
      function moodEditor(photo=false){const draft=currentDraft(),tags=cleanWords(draft?.moodTags);return `<div class="mood-box">${photo?'<div class="mood-caption">오늘의 감정</div>':''}${wordGrid(tags,photo)}${photo?'':`<div class="custom-row"><button class="custom-toggle" type="button" data-add-word>＋ 직접 쓰기</button><span class="selected-count">${tags.length}개 골랐어요</span></div>${ui.wordInputOpen?'<input class="custom-input" data-custom-word maxlength="20" placeholder="감정 단어를 쓰고 Enter">':''}`}${temperatureTrack(moodValue(draft?.mood))}</div>`;}
      function renderDraftList(kind,items){return `<div class="draft-list">${items.map((item,index)=>`<div class="draft-item"><span class="state-dot"></span><span class="draft-title">${escapeHtml(typeof item==='string'?item:item.t)}</span><button class="remove-item" type="button" data-remove-list="${kind}" data-index="${index}">×</button></div>`).join('')}</div><input class="list-input" data-list-input="${kind}" value="${escapeHtml(ui.pending[ui.questStep]||'')}" placeholder="항목을 입력하고 Enter"><div class="list-help">Enter로 추가 · 비워두고 넘어가도 됩니다</div>`;}
      function renderStepBody(){const q=ui.questDraft,step=ui.questStep;if(step===1)return moodEditor(false);if(step===2)return renderDraftList('main',q.main);if(step===3)return renderDraftList('sub',q.sub);if(step===4)return `<textarea class="textarea" data-event-field="t" placeholder="오늘 발생한 이벤트">${escapeHtml(q.event.t)}</textarea><input class="field" data-event-field="c" value="${escapeHtml(q.event.c)}" placeholder="그때 고른 선택지">`;if(step===5)return renderDraftList('achieve',q.achieve);return `<textarea class="textarea" data-quest-field="ending" placeholder="하루를 마무리하는 한두 줄">${escapeHtml(q.ending)}</textarea>`;}
      function editorDateInput(){return `<input class="editor-date-input" type="date" value="${ui.selectedDate}" data-editor-date aria-label="일기 날짜"${busy?' disabled':''}>`;}
      function renderQuestEditor(){const [question,hint]=STEPS[ui.questStep-1];app.innerHTML=`<section class="editor"><header class="editor-head">${editorDateInput()}${modePill('quest')}<button class="text-button" type="button" data-cancel${busy?' disabled':''}>취소</button></header><div class="progress">${Array.from({length:6},(_,i)=>`<span class="progress-part${i<ui.questStep?' active':''}"></span>`).join('')}</div><div class="question"><div class="question-title">${question}</div><div class="hint">${hint}</div></div><div class="step-body">${renderStepBody()}</div><div class="button-row">${requestStatus()}<button class="primary" type="button" data-next${busy?' disabled':''}>${ui.questStep===6?'저장하고 끝내기':'다음'}</button><button class="text-button" type="button" data-skip${busy?' disabled':''}>건너뛰기</button>${ui.questStep>1?`<button class="secondary-button" type="button" data-prev${busy?' disabled':''}>이전</button>`:''}<span class="button-spacer"></span><button class="secondary-button" type="button" data-switch-photo${busy?' disabled':''}>사진 모드로 바꾸기</button><button class="secondary-button" type="button" data-save-quest${busy?' disabled':''}>바로 저장</button></div></section>`;if(ui.wordInputOpen&&!busy)requestAnimationFrame(()=>app.querySelector('[data-custom-word]')?.focus());}
      function renderPhotoEditor(){const d=ui.photoDraft;app.innerHTML=`<section class="editor"><header class="editor-head">${editorDateInput()}${modePill('photo')}<button class="text-button" type="button" data-cancel${busy?' disabled':''}>취소</button></header><div class="step-body"><div class="photo-label">사진 · ${d.photos.length}장</div><div class="photo-slots">${d.photos.map((src,index)=>`<div class="photo-slot-wrap"><div class="photo-slot"><img src="${escapeHtml(src)}" alt=""><button class="remove-photo" type="button" data-remove-photo="${index}">×</button></div></div>`).join('')}<label class="add-photo" for="todayPhotoInput"><span>＋</span><span>사진 업로드</span><input id="todayPhotoInput" type="file" accept="image/*" multiple data-photo-input aria-label="사진 업로드"></label></div><div class="photo-help">원본 파일과 비율 그대로 저장되며 캘린더에 바로 반영됩니다</div><textarea class="textarea" data-photo-text placeholder="사진에 대해 짧게 적어보세요">${escapeHtml(d.text)}</textarea>${moodEditor(true)}</div><div class="button-row">${requestStatus()}<button class="primary" type="button" data-save-photo${busy?' disabled':''}>저장</button><button class="secondary-button" type="button" data-switch-quest${busy?' disabled':''}>퀘스트 모드로 바꾸기</button></div></section>`;}
      function render(){if(ui.screen==='quest')renderQuestEditor();else if(ui.screen==='photo')renderPhotoEditor();else renderHome();}
      function beginQuest(edit=false,preserve=false){const existing=store.entries[ui.selectedDate];if(!preserve){ui.originalDate=edit?ui.selectedDate:null;syncShared(entryMood(existing));}if(!preserve||!ui.questDraft)ui.questDraft=edit&&existing?.mode==='quest'?normalizeQuest(clone(existing.quest)):emptyQuest();applyShared(ui.questDraft);ui.pending={2:'',3:'',5:''};ui.questStep=1;ui.wordInputOpen=false;ui.screen='quest';render();}
      function beginPhoto(edit=false,preserve=false){const existing=store.entries[ui.selectedDate];if(!preserve){ui.originalDate=edit?ui.selectedDate:null;syncShared(entryMood(existing));}if(!preserve||!ui.photoDraft)ui.photoDraft=edit&&existing?.mode==='photo'?{photos:[...(existing.photos||[])],text:String(existing.text??''),mood:moodValue(existing.mood),moodTags:cleanWords(existing.moodTags)}:{photos:[],text:'',mood:null,moodTags:[]};applyShared(ui.photoDraft);ui.wordInputOpen=false;ui.screen='photo';render();}
      function updateMood(){const draft=currentDraft();if(!draft)return;syncShared(draft);}
      function commitPending(){const value=(ui.pending[ui.questStep]||'').trim();if(!value)return;if(ui.questStep===2)ui.questDraft.main.push({t:value,done:false});if(ui.questStep===3)ui.questDraft.sub.push({t:value,done:false});if(ui.questStep===5)ui.questDraft.achieve.push(value);ui.pending[ui.questStep]='';}
      async function persistEntry(date,entry){if(busy)return false;loadSequence++;busy=true;requestMessage='저장 중…';render();const originalDate=ui.originalDate;try{await Store.saveDiary(diaryPayload(date,entry));if(originalDate&&originalDate!==date)await Store.deleteDiary(originalDate);ui.originalDate=null;ui.screen='home';ui.showTodayComposer=false;ui.confirmingDeleteDate=null;requestMessage='';busy=false;justSaved=true;await loadHomeData(false,true);return true;}catch(_){busy=false;requestMessage='저장 실패, 다시 시도';render();return false;}}
      async function deleteEntry(date){if(busy)return;loadSequence++;busy=true;requestMessage='삭제 중…';renderHome();try{await Store.deleteDiary(date);ui.confirmingDeleteDate=null;ui.showTodayComposer=ui.selectedDate===TODAY;requestMessage='';busy=false;await loadHomeData(false,true);}catch(_){busy=false;requestMessage='삭제 실패, 다시 시도';renderHome();}}
      async function saveQuest(){commitPending();applyShared(ui.questDraft);return persistEntry(ui.selectedDate,{mode:'quest',quest:clone(ui.questDraft)});}
      async function savePhoto(){applyShared(ui.photoDraft);return persistEntry(ui.selectedDate,{mode:'photo',photos:[...ui.photoDraft.photos],text:ui.photoDraft.text,mood:ui.photoDraft.mood,moodTags:[...ui.photoDraft.moodTags]});}
      async function toggleTask(date,type,index){const entry=clone(store.entries[date]);if(entry?.mode!=='quest'||!entry.quest?.[type]?.[index])return;entry.quest[type][index].done=!entry.quest[type][index].done;await persistEntry(date,entry);const btn=app.querySelector(`[data-toggle-task="${type}"][data-index="${index}"][data-date="${date}"]`);if(btn&&btn.classList.contains('done'))widgetMotion.pop(btn.querySelector('.state-dot'));}
      async function addCustomWord(value){const next=cleanWords([...customWords,value]).filter(word=>!PRESET_WORDS.includes(word)).slice(0,16);busy=true;requestMessage='저장 중…';renderQuestEditor();try{await Store.saveMoodWords(next);customWords=next;if(!ui.questDraft.moodTags.includes(value))ui.questDraft.moodTags.push(value);updateMood();ui.wordInputOpen=false;requestMessage='';busy=false;renderQuestEditor();}catch(_){busy=false;requestMessage='저장 실패, 다시 시도';ui.wordInputOpen=true;renderQuestEditor();}}
      function readPhoto(file){return new Promise(resolve=>{try{const reader=new FileReader();reader.onerror=()=>resolve(null);reader.onload=()=>resolve(typeof reader.result==='string'?reader.result:null);reader.readAsDataURL(file);}catch(_){resolve(null);}});}

      app.addEventListener('click',async event=>{
        const target=event.target;
        if(target.closest('[data-retry]')){await loadHomeData();return;}
        if(busy)return;
        const start=target.closest('[data-start]');
        if(start){start.dataset.start==='quest'?beginQuest():beginPhoto();return;}
        const edit=target.closest('[data-edit-date]');
        if(edit){ui.selectedDate=edit.dataset.editDate;const entry=store.entries[ui.selectedDate];entry?.mode==='photo'?beginPhoto(true):beginQuest(true);return;}
        const deleteRequest=target.closest('[data-delete-request]');
        if(deleteRequest){ui.confirmingDeleteDate=deleteRequest.dataset.deleteRequest;renderHome();return;}
        if(target.closest('[data-cancel-delete]')){ui.confirmingDeleteDate=null;renderHome();return;}
        const confirmDelete=target.closest('[data-confirm-delete]');
        if(confirmDelete){await deleteEntry(confirmDelete.dataset.confirmDelete);return;}
        if(target.closest('[data-write-today]')){ui.selectedDate=TODAY;ui.showTodayComposer=true;ui.confirmingDeleteDate=null;renderHome();return;}
        const toggle=target.closest('[data-toggle-task]');
        if(toggle){await toggleTask(toggle.dataset.date,toggle.dataset.toggleTask,Number(toggle.dataset.index));return;}
        if(target.closest('[data-cancel]')){ui.originalDate=null;ui.screen='home';ui.showTodayComposer=false;requestMessage='';render();return;}
        const word=target.closest('[data-mood-word]');
        if(word){const draft=currentDraft(),value=word.dataset.moodWord,index=draft.moodTags.indexOf(value);index>=0?draft.moodTags.splice(index,1):draft.moodTags.push(value);updateMood();ui.screen==='quest'?renderQuestEditor():renderPhotoEditor();return;}
        const mood=target.closest('[data-mood-value]');
        if(mood){const draft=currentDraft(),value=Number(mood.dataset.moodValue);draft.mood=draft.mood===value?null:value;updateMood();ui.screen==='quest'?renderQuestEditor():renderPhotoEditor();return;}
        if(target.closest('[data-add-word]')){ui.wordInputOpen=!ui.wordInputOpen;renderQuestEditor();return;}
        const remove=target.closest('[data-remove-list]');
        if(remove){ui.questDraft[remove.dataset.removeList].splice(Number(remove.dataset.index),1);renderQuestEditor();return;}
        if(target.closest('[data-next]')){commitPending();if(ui.questStep===6)await saveQuest();else{ui.questStep++;ui.wordInputOpen=false;renderQuestEditor();}return;}
        if(target.closest('[data-skip]')){ui.pending[ui.questStep]='';if(ui.questStep===6)await saveQuest();else{ui.questStep++;ui.wordInputOpen=false;renderQuestEditor();}return;}
        if(target.closest('[data-prev]')){commitPending();ui.questStep=Math.max(1,ui.questStep-1);renderQuestEditor();return;}
        if(target.closest('[data-save-quest]')){await saveQuest();return;}
        if(target.closest('[data-switch-photo]')){commitPending();beginPhoto(false,true);return;}
        const removePhoto=target.closest('[data-remove-photo]');
        if(removePhoto){ui.photoDraft.photos.splice(Number(removePhoto.dataset.removePhoto),1);renderPhotoEditor();return;}
        if(target.closest('[data-save-photo]')){await savePhoto();return;}
        if(target.closest('[data-switch-quest]'))beginQuest(false,true);
      });
      app.addEventListener('input',event=>{const el=event.target;if(el.matches('[data-quest-field]'))ui.questDraft[el.dataset.questField]=el.value;if(el.matches('[data-event-field]'))ui.questDraft.event[el.dataset.eventField]=el.value;if(el.matches('[data-list-input]'))ui.pending[ui.questStep]=el.value;if(el.matches('[data-photo-text]'))ui.photoDraft.text=el.value;});
      app.addEventListener('keydown',async event=>{if(busy)return;const listInput=event.target.closest('[data-list-input]');if(listInput&&event.key==='Enter'){event.preventDefault();commitPending();renderQuestEditor();requestAnimationFrame(()=>app.querySelector('[data-list-input]')?.focus());return;}const custom=event.target.closest('[data-custom-word]');if(custom&&event.key==='Enter'){event.preventDefault();const value=custom.value.trim();if(!value)return;await addCustomWord(value);}});
      app.addEventListener('change',async event=>{const dateInput=event.target.closest('[data-editor-date]');if(dateInput){const value=dateInput.value;if(/^\d{4}-\d{2}-\d{2}$/.test(value)&&localKey(fromKey(value))===value){if(ui.screen==='quest')commitPending();ui.selectedDate=value;ui.screen==='quest'?renderQuestEditor():renderPhotoEditor();}return;}const input=event.target.closest('[data-photo-input]');if(!input)return;const files=[...input.files].filter(file=>file.type.startsWith('image/')),photos=await Promise.all(files.map(readPhoto));ui.photoDraft.photos.push(...photos.filter(Boolean));renderPhotoEditor();});
      loadHomeData();
    })();
  </script>
  <script src="../widget-frame.js"></script>
</body>
</html>

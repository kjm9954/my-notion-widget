<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>기록 달력</title><link rel="stylesheet" href="diary-v2.css?v=20261109-paste"></head>
<body><main class="root" id="root" aria-labelledby="title">
  <header class="head"><h1 class="title" id="title">기록 달력</h1><nav class="nav" aria-label="달력 월"><button class="today-link" id="this-month" type="button">이번 달</button><button class="arrow" id="prev" type="button" aria-label="이전 달">‹</button><span class="nav-label" id="month"></span><button class="arrow" id="next" type="button" aria-label="다음 달">›</button></nav></header>
  <div class="weekdays" aria-hidden="true"><span class="weekday">일</span><span class="weekday">월</span><span class="weekday">화</span><span class="weekday">수</span><span class="weekday">목</span><span class="weekday">금</span><span class="weekday">토</span></div>
  <div class="grid" id="grid" aria-label="날짜별 기록"></div><p class="note" id="note" data-status role="status"></p>
  <div class="dim" id="detail" hidden><section class="card" role="dialog" aria-modal="true" aria-labelledby="detail-title"><div class="card-head"><h2 id="detail-title"></h2><button class="close" data-close type="button" aria-label="닫기">✕</button></div><div class="card-body" id="detail-body"></div><div class="card-foot"><button class="link" id="delete" type="button">기록 삭제</button><button class="save" id="edit" type="button">수정</button></div></section></div>
  <div class="dim" id="quick" hidden><section class="card" role="dialog" aria-modal="true" aria-labelledby="quick-title"><div class="card-head"><h2 id="quick-title"></h2><button class="close" data-close type="button" aria-label="닫기">✕</button></div><div class="card-body"><div class="quick-moods"><p class="mood-caption" id="quick-caption">그날의 기분 · 선택</p><div class="moods" id="quick-moods" role="group" aria-labelledby="quick-caption"></div></div><textarea class="quick-text" id="quick-text" maxlength="2000" aria-label="그날의 기록" placeholder="그날 있었던 일…"></textarea><p class="status" id="quick-status" role="status"></p><div class="quick-photos" id="quick-photos" aria-label="첨부 사진"></div></div><div class="card-foot"><span class="char-count" id="quick-count"></span><button class="save" id="quick-save" type="button">저장</button></div></section></div>
  <div class="dim" id="confirm" hidden><section class="card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title"><div class="card-head"><h2 id="confirm-title">이 날짜의 기록을 삭제할까요?</h2><button class="close" data-close type="button" aria-label="닫기">✕</button></div><div class="card-body"><p>글과 첨부 사진이 함께 삭제됩니다.</p><p class="status" id="delete-status" role="status"></p></div><div class="card-foot"><button class="quiet" data-close type="button">취소</button><button class="save" id="confirm-delete" type="button">삭제</button></div></section></div>
  <div class="dim conflict-layer" id="conflict" hidden><section class="card" role="dialog" aria-modal="true" aria-labelledby="conflict-title"><div class="card-head"><h2 id="conflict-title">최신 기록 확인</h2><button class="close" data-close type="button" aria-label="닫기">✕</button></div><div class="card-body" id="conflict-body"></div><div class="card-foot"><button class="quiet" id="use-latest" type="button">최신 기록 사용</button><button class="save" id="use-draft" type="button">내 초안으로 다시 작성</button></div></section></div>
</main><script src="diary-v1-client.js?v=20261109"></script><script type="module" src="diary-v2-calendar.js?v=20261109-paste"></script></body></html>

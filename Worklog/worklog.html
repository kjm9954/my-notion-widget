<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>업무일지</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root {
      --action:#0E5C7A; --action-soft:#E2F0F6; --mid:#CFE2EA;
      --text:#12303C; --title:#33505C; --secondary:#6B8794; --deep:#55707C;
      --muted:#93A5AD; --faint:#A2B4BC; --complete:#A9BAC2; --inactive:#C6D6DD;
      --border:#DCE7ED; --border-soft:#E6EDF0; --border-faint:#EDF2F4; --border-pale:#F1F5F7;
      --surface:#FFFFFF; --surface-soft:#FAFCFD; --pill:#F5F9FB;
      --danger-border:#E4D5D5; --danger:#A56B6B;
    }
    * { box-sizing:border-box; }
    html, body { min-height:100%; background:transparent; }
    body {
      margin:0; color:var(--text); font-family:"Pretendard Variable", Pretendard, -apple-system, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button, input, select { color:inherit; font:inherit; }
    button { cursor:pointer; }
    .card {
      position:relative; width:100%; max-width:1350px; height:595px; margin:0 auto; padding:22px;
      display:flex; flex-direction:column; gap:10px; overflow:hidden; background:var(--surface);
      border-radius:18px; box-shadow:0 1px 2px rgba(18,48,60,.04), 0 6px 18px rgba(18,48,60,.06);
    }
    .worklog-top { flex:0 0 auto; display:flex; flex-direction:column; gap:10px; }
    .worklog-bottom { flex:0 0 auto; }
    .mode-row { min-height:30px; display:flex; align-items:center; justify-content:flex-end; gap:8px; }
    .mode-pill {
      min-height:30px; padding:6px 13px; border:1px solid var(--border); border-radius:999px;
      background:var(--surface); color:var(--secondary); font-size:11px; font-weight:700;
    }
    .mode-pill.is-selected[data-mode="work"] { border-color:var(--action); background:var(--action); color:#FFFFFF; }
    .mode-pill.is-selected[data-mode="life"] { border-color:var(--mid); background:var(--mid); color:var(--action); }
    .day-nav { min-height:34px; display:grid; grid-template-columns:26px minmax(0,1fr) 26px; align-items:center; gap:8px; }
    .nav-arrow {
      position:relative; width:26px; height:34px; padding:0; border:1px solid var(--border); border-radius:8px;
      background:var(--surface); color:var(--muted); font-size:17px; font-weight:700; line-height:1;
    }
    .day-track { min-width:0; padding:3px; display:flex; background:var(--border-pale); border-radius:9px; }
    .day-button {
      min-width:40px; min-height:36px; flex:1; padding:3px 2px; border:0; border-radius:7px;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
      background:transparent; color:#8AA0AA;
    }
    .day-button.is-future { opacity:.5; }
    .day-button.is-selected {
      background:var(--surface); color:var(--text); box-shadow:0 1px 2px rgba(18,48,60,.10);
    }
    .day-name { font-size:12px; font-weight:800; line-height:1.1; }
    .day-count-line { min-height:12px; display:flex; align-items:center; justify-content:center; gap:2px; }
    .day-count { color:var(--faint); font-size:9px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; }
    .day-button.is-selected .day-count { font-weight:800; }
    .day-button.is-selected.mode-work .day-count { color:var(--action); }
    .day-button.is-selected.mode-life .day-count { color:var(--action); }
    .roll-count {
      padding:1px 4px; border-radius:999px; background:var(--action-soft); color:var(--action);
      font-size:8px; font-weight:800; line-height:1.2; font-variant-numeric:tabular-nums;
    }
    .roll-banner {
      flex:0 0 auto; padding:11px 12px; display:flex; flex-direction:column; gap:4px;
      background:var(--action-soft); border-radius:12px;
    }
    .roll-banner[hidden] { display:none; }
    .banner-kicker { color:var(--action); font-size:9px; font-weight:800; letter-spacing:.06em; }
    .banner-copy { color:var(--text); font-size:11px; font-weight:700; }
    .banner-dismiss {
      align-self:flex-end; padding:0; border:0; background:transparent; color:var(--action); font-size:9px; font-weight:800;
    }
    .card-header {
      min-height:39px; padding-top:12px; border-top:1px solid var(--border-faint);
      display:flex; align-items:center; justify-content:space-between; gap:14px;
    }
    .date-side, .summary-side { min-width:0; display:flex; align-items:center; gap:7px; }
    .date-title { color:var(--text); font-size:13px; font-weight:800; white-space:nowrap; }
    .weekday-label { color:var(--secondary); font-size:11px; font-weight:700; white-space:nowrap; }
    .today-pill {
      padding:3px 7px; border-radius:999px; background:var(--action-soft); color:var(--action); font-size:10px; font-weight:700;
    }
    .week-caption { color:var(--faint); font-size:9px; font-weight:700; white-space:nowrap; }
    .summary-side { justify-content:flex-end; color:var(--secondary); font-size:11px; font-weight:700; white-space:nowrap; }
    .summary-side strong { color:var(--text); font-weight:800; }
    .summary-divider { color:var(--inactive); }
    .time-summary { color:var(--text); font-variant-numeric:tabular-nums; }
    .time-summary span { color:var(--faint); font-size:10px; }
    .list-shell {
      min-height:160px; flex:1; padding:12px; overflow:hidden;
      display:flex; flex-direction:column; gap:6px; background:var(--surface-soft);
      border:1px solid var(--border-pale); border-radius:12px;
    }
    .rows-scroll {
      min-height:0; flex:1; overflow-x:hidden; overflow-y:auto; display:flex; flex-direction:column; gap:6px;
      scrollbar-width:thin; scrollbar-color:var(--inactive) transparent;
    }
    .list-shell.is-empty {
      padding:26px 12px; align-items:center; justify-content:center; gap:4px;
      border:1px dashed var(--inactive); text-align:center;
    }
    .empty-title { color:var(--title); font-size:12px; font-weight:800; }
    .empty-copy { color:var(--muted); font-size:10px; font-weight:600; }
    .column-head, .task-row { display:grid; align-items:center; gap:10px; }
    .column-head.work, .task-row.work {
      grid-template-columns:62px 22px minmax(0,1fr) 52px 46px 46px 42px 42px 52px 24px 24px;
    }
    .column-head.life, .task-row.life {
      grid-template-columns:62px 22px minmax(0,1.2fr) 52px minmax(0,1fr) 24px 24px;
    }
    .column-head {
      flex:0 0 auto; padding:0 10px 8px; border-bottom:1px solid var(--border-faint);
      background:transparent; color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.06em;
    }
    .column-head span { text-align:center; }
    .column-head span:nth-child(3), .column-head.life span:nth-child(5) { text-align:left; }
    .column-head span.numeric { text-align:center; }
    .task-row {
      height:40px; min-height:40px; flex:0 0 auto; padding:7px 10px; background:var(--surface); border-radius:9px;
      box-shadow:0 1px 2px rgba(18,48,60,.05); outline:1px solid transparent; outline-offset:-1px;
      transition:outline-color .12s var(--ease);
    }
    @media (hover:hover) { .task-row:hover { outline-color:var(--border-soft); } }
    .project-pill {
      min-width:0; padding:3px 5px; overflow:hidden; border-radius:999px; background:var(--pill); color:var(--secondary);
      font-size:10px; font-weight:700; text-align:center; text-overflow:ellipsis; white-space:nowrap;
    }
    .cell-button {
      min-width:0; min-height:24px; padding:0; border:0; border-radius:8px; background:transparent;
      outline:2px solid transparent; outline-offset:-2px; transition:color .12s var(--ease), outline-color .12s var(--ease), background-color .12s var(--ease);
    }
    .cell-button.is-popover-open { outline-color:var(--action); }
    .project-button { width:100%; }
    .q-slot { width:100%; display:flex; justify-content:center; }
    .q-button { width:22px; height:24px; display:grid; place-items:center; color:var(--inactive); font-size:10px; font-weight:700; }
    .q-badge {
      width:17px; height:17px; border-radius:5px; display:grid; place-items:center;
      color:#FFFFFF; font-size:9px; font-weight:800; line-height:1;
    }
    .q-1 { background:var(--title); }
    .q-2 { background:var(--secondary); }
    .q-3 { background:var(--complete); }
    .q-4 { background:var(--border-faint); color:var(--muted); }
    .q-none { background:var(--border-faint); color:var(--muted); }
    .task-main { min-width:0; display:flex; flex-direction:column; justify-content:center; }
    .task-title-button, .memo-button {
      width:100%; min-width:0; height:26px; padding:4px 6px; overflow:hidden; border:0; border-radius:8px; background:transparent; color:var(--text);
      display:block; font-size:12px; font-weight:600; line-height:1.2; text-align:left; text-overflow:ellipsis; white-space:nowrap;
    }
    .memo-button { color:var(--deep); font-size:11px; }
    .memo-button.is-empty { color:transparent; }
    @media (hover:hover) {
      .task-title-button:hover, .memo-button:hover { background:var(--surface); box-shadow:0 1px 2px rgba(18,48,60,.05); }
      .memo-button.is-empty:hover { color:var(--border-soft); }
    }
    .quick-title-input {
      width:100%; min-width:0; height:26px; padding:4px 6px; border:0; border-radius:8px;
      background:transparent; color:var(--text); font-size:12px; font-weight:600;
      outline:2px solid var(--action); outline-offset:-2px;
    }
    .inline-cell-input {
      width:100%; min-width:0; height:26px; padding:4px 6px; border:0; border-radius:8px;
      background:var(--surface); color:var(--text); font-size:12px; font-weight:600;
      outline:2px solid var(--action); outline-offset:-2px;
    }
    .inline-cell-input.memo-input { font-size:11px; }
    .inline-cell-input.time-input { height:24px; padding:3px 2px; font-size:11px; font-weight:700; text-align:center; font-variant-numeric:tabular-nums; }
    .roll-caption { display:block; margin-top:1px; color:var(--faint); font-size:9px; font-weight:700; line-height:1; }
    .cell, .number-cell {
      min-width:0; overflow:hidden; color:var(--deep); font-size:10px; font-weight:700; text-overflow:ellipsis; white-space:nowrap;
    }
    .task-title-button, .cell, .number-cell, .memo { transition:color .12s var(--ease); }
    .number-cell { text-align:center; font-variant-numeric:tabular-nums; }
    .number-button { width:100%; text-align:center; }
    .date-cell { width:100%; cursor:pointer; }
    .duration { color:var(--text); }
    .is-missing { color:var(--inactive); }
    .memo { color:var(--deep); font-size:11px; font-weight:600; }
    .memo.is-missing { color:var(--complete); }
    .status-pill {
      min-width:0; padding:3px 4px; border-radius:999px; overflow:hidden;
      font-size:9px; font-weight:700; text-align:center; text-overflow:ellipsis; white-space:nowrap;
    }
    .status-button { width:100%; }
    .status-doing { background:var(--action); color:#FFFFFF; }
    .status-done { background:var(--pill); color:var(--secondary); }
    .status-wait { border:1px dashed var(--inactive); background:var(--surface); color:var(--muted); }
    .check-wrap { width:100%; height:18px; display:grid; place-items:center; }
    .done-check {
      width:15px; height:15px; padding:0; border:1.5px solid var(--inactive); border-radius:4px;
      display:grid; place-items:center; background:var(--surface); color:#FFFFFF; font-size:9px; font-weight:800; line-height:1;
      transition:background-color .12s var(--ease), border-color .12s var(--ease), color .12s var(--ease);
    }
    .done-check.is-done.mode-work { border-color:var(--action); background:var(--action); }
    .done-check.is-done.mode-life { border-color:var(--mid); background:var(--mid); color:var(--action); }
    .task-row.is-done .task-title-button, .task-row.is-done .cell, .task-row.is-done .number-cell, .task-row.is-done .memo { color:var(--complete); }
    .task-row.is-done .task-title-button { text-decoration:line-through; }
    .time-cell { position:relative; min-width:0; height:24px; display:flex; align-items:center; justify-content:center; }
    .time-value { width:100%; height:24px; text-align:center; font-variant-numeric:tabular-nums; }
    .time-actions { position:absolute; inset:0; display:none; align-items:center; justify-content:center; gap:2px; background:var(--surface); }
    .time-action { width:20px; height:24px; padding:0; border:0; border-radius:8px; background:transparent; color:var(--muted); font-size:10px; font-weight:700; }
    @media (hover:hover) { .time-cell.has-value:hover .time-actions { display:flex; } }
    .delete-wrap { width:24px; height:24px; display:grid; place-items:center; }
    .row-delete {
      width:24px; height:24px; padding:0; border:0; border-radius:8px; background:transparent;
      color:var(--border-soft); font-size:11px; font-weight:700; line-height:1;
      transition:color .12s var(--ease);
    }
    @media (hover:hover) { .row-delete:hover { color:var(--muted); } }
    .task-row.is-delete-confirm { outline-color:var(--danger-border); }
    .task-row.is-delete-confirm .row-delete { color:var(--danger); font-size:12px; font-weight:800; }
    .mobile-work-meta { display:none; }
    .inline-editor {
      flex:0 0 auto; padding:10px; background:var(--surface); border-radius:9px;
      box-shadow:0 1px 2px rgba(18,48,60,.05); outline:1px solid var(--border-soft); outline-offset:-1px;
    }
    .editor-fields { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
    .editor-field { min-width:0; display:flex; flex-direction:column; gap:4px; color:var(--muted); font-size:9px; font-weight:800; }
    .editor-field.is-wide { grid-column:span 2; }
    .editor-field input, .editor-field select {
      width:100%; min-width:0; height:32px; padding:6px 8px; border:1px solid var(--border); border-radius:8px;
      background:var(--surface-soft); color:var(--text); font-size:11px; font-weight:600; outline:none;
      transition:border-color .12s var(--ease);
    }
    .editor-field input:focus, .editor-field select:focus { border-color:var(--action); }
    .editor-actions { min-height:34px; margin-top:8px; display:flex; align-items:center; justify-content:flex-end; gap:7px; }
    .editor-button {
      min-height:30px; padding:5px 10px; border:1px solid var(--border); border-radius:8px;
      background:var(--surface); color:var(--secondary); font-size:10px; font-weight:700;
    }
    .editor-button.primary { border-color:var(--action); background:var(--action); color:#FFFFFF; }
    .editor-button.danger { margin-right:auto; border-color:var(--danger-border); color:var(--danger); }
    .editor-button.confirm-danger { margin-right:auto; border-color:var(--danger); background:var(--danger); color:#FFFFFF; }
    .add-row {
      width:100%; min-height:40px; flex:0 0 auto; padding:7px 10px; border:1px dashed var(--inactive); border-radius:9px;
      display:flex; align-items:center; justify-content:center; gap:6px; background:var(--surface); color:var(--muted);
      font-size:11px; font-weight:700;
    }
    .add-plus { font-size:13px; font-weight:700; }
    .add-editor { flex:0 0 auto; }
    .cell-popover {
      position:absolute; z-index:30; width:168px; max-width:calc(100% - 24px); padding:10px 12px; border:0; border-radius:14px;
      background:var(--surface); box-shadow:0 1px 2px rgba(18,48,60,.04), 0 6px 18px rgba(18,48,60,.06);
    }
    .cell-popover[hidden] { display:none; }
    .cell-popover.kind-project { width:108px; max-height:220px; overflow-y:auto; }
    .cell-popover.kind-q { width:60px; }
    .cell-popover.kind-due { width:176px; }
    .popover-label { display:block; margin-bottom:7px; color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.06em; }
    .project-options, .q-options { display:flex; flex-direction:column; gap:5px; }
    .project-option {
      min-height:24px; padding:4px 7px; overflow:hidden; border:0; border-radius:999px; background:var(--pill); color:var(--secondary);
      font-size:9px; font-weight:700; text-align:center; text-overflow:ellipsis; white-space:nowrap;
    }
    .project-option.is-selected { background:var(--action); color:#FFFFFF; }
    .project-new {
      min-height:24px; padding:4px 5px; border:1px dashed var(--inactive); border-radius:8px; background:var(--surface); color:var(--muted);
      font-size:9px; font-weight:700;
    }
    .project-new-input { width:100%; height:24px; padding:4px 5px; border:1px solid var(--border); border-radius:8px; background:var(--surface); font-size:9px; font-weight:700; outline:none; }
    .project-new-input:focus { border-color:var(--action); }
    .q-option { width:36px; min-height:28px; padding:0; border:0; border-radius:8px; display:grid; place-items:center; background:transparent; }
    .q-option.is-selected { outline:2px solid var(--action); outline-offset:-2px; }
    .popover-controls { display:grid; grid-template-columns:28px minmax(40px,1fr) 28px; align-items:center; gap:8px; }
    .popover-step {
      width:28px; height:28px; padding:0; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--secondary);
      display:grid; place-items:center; font-size:11px; font-weight:700;
    }
    .popover-value { min-width:40px; color:var(--text); font-size:15px; font-weight:800; text-align:center; font-variant-numeric:tabular-nums; }
    .popover-caption { display:block; margin-top:7px; color:var(--faint); font-size:9px; font-weight:700; line-height:1.4; text-align:center; }
    .mini-calendar-head { margin-bottom:7px; display:grid; grid-template-columns:20px minmax(0,1fr) 20px; align-items:center; gap:4px; }
    .mini-calendar-nav { width:20px; height:20px; padding:0; border:0; border-radius:8px; background:var(--surface); color:var(--secondary); font-size:12px; font-weight:700; }
    .mini-calendar-title { color:var(--text); font-size:11px; font-weight:800; text-align:center; }
    .mini-calendar-week, .mini-calendar-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:2px; }
    .mini-calendar-week span { color:var(--muted); font-size:9px; font-weight:700; text-align:center; }
    .mini-calendar-day { aspect-ratio:1/1; min-width:0; padding:0; border:0; border-radius:4px; background:transparent; color:var(--deep); font-size:9px; font-weight:700; }
    .mini-calendar-day.is-other { color:var(--inactive); }
    .mini-calendar-day.is-today { color:var(--action); }
    .mini-calendar-day.is-selected { outline:2px solid var(--action); outline-offset:-2px; }
    .mini-calendar-day.is-selected.is-today { outline-color:transparent; }
    .mini-calendar-actions { margin-top:7px; display:flex; gap:5px; }
    .mini-calendar-actions button { min-height:24px; flex:1; padding:4px; border:0; border-radius:8px; background:var(--pill); color:var(--secondary); font-size:9px; font-weight:700; }
    .sr-only {
      position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
      clip:rect(0,0,0,0); white-space:nowrap; border:0;
    }
    @media (max-width:999px) and (min-width:640px) {
      .column-head.work, .task-row.work {
        grid-template-columns:62px 22px minmax(90px,1fr) 52px 46px 46px 42px 42px 52px 24px 24px;
      }
    }
    @media (max-width:639px) {
      .card { padding:14px; }
      .mode-pill {
        position:relative; min-width:44px; min-height:44px; padding:0 13px;
        border-color:transparent; background:transparent; isolation:isolate;
      }
      .mode-pill::before {
        content:""; position:absolute; left:0; right:0; top:7px; height:30px;
        z-index:-1; border:1px solid var(--border); border-radius:999px; background:var(--surface);
      }
      .mode-pill.is-selected[data-mode="work"] { border-color:transparent; background:transparent; }
      .mode-pill.is-selected[data-mode="work"]::before { border-color:var(--action); background:var(--action); }
      .mode-pill.is-selected[data-mode="life"] { border-color:transparent; background:transparent; }
      .mode-pill.is-selected[data-mode="life"]::before { border-color:var(--mid); background:var(--mid); }
      .day-nav { grid-template-columns:44px minmax(0,1fr) 44px; gap:2px; }
      .nav-arrow { width:44px; height:44px; border:0; background:transparent; }
      .nav-arrow::before {
        content:""; position:absolute; left:9px; top:5px; width:26px; height:34px;
        border:1px solid var(--border); border-radius:8px; background:var(--surface); z-index:-1;
      }
      .day-button { min-height:40px; padding-left:0; padding-right:0; }
      .card-header { align-items:flex-start; }
      .summary-side { flex-wrap:wrap; row-gap:3px; }
      .column-head.work { display:none; }
      .task-row.work {
        height:auto; min-height:0; padding:9px 10px; display:grid; grid-template-columns:minmax(0,1fr) 44px 40px; gap:6px;
      }
      .task-row.work > :not(.task-main):not(.check-wrap):not(.delete-wrap):not(.mobile-work-meta) { display:none; }
      .task-row.work .task-main { grid-column:1; grid-row:1; }
      .task-row.work .task-title-button { font-size:13px; }
      .task-row.work .check-wrap { width:44px; height:44px; grid-column:2; grid-row:1 / span 3; }
      .task-row.work .delete-wrap { width:40px; height:44px; grid-column:3; grid-row:1 / span 3; }
      .task-row.work .done-check {
        position:relative; width:44px; height:44px; border:0; background:transparent; color:transparent;
      }
      .task-row.work .done-check::before {
        content:""; position:absolute; left:50%; top:50%; width:15px; height:15px;

      .task-row.life .project-button { grid-column:1; grid-row:1; }

      .task-row .cell-button { min-height:40px; }

      .column-head { padding-left:7px; padding-right:7px; }

    @media (max-width:447px) { .task-row.life { grid-template-columns:52px 22px minmax(0,1fr) 40px 40px; gap:5px; } }
    @media (max-width:320px) {
      .card { padding-left:10px; padding-right:10px; }
      .day-track { overflow-x:auto; scrollbar-width:none; scroll-snap-type:x proximity; }
      .day-track::-webkit-scrollbar { display:none; }

      .task-row.life { grid-template-columns:44px 18px minmax(0,1fr) 40px 40px; gap:4px; }
    }
  </style>
  <link rel="stylesheet" href="../widget-frame.css">

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이번 주 한 일</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="../../widget-frame.css?v=20260930-mobile-layout">
  <link rel="stylesheet" href="sky-lime.css?v=20261015-sky-lime">
  <style>
    .sl-week { padding: 22px 24px 20px; }
    .sl-week-head { flex: none; }
    .sl-week .sl-nav-label { font-variant-numeric: tabular-nums; }
    .sl-week-titlebar { flex: none; margin-top: 18px; }
    .sl-week-title { margin: 0; color: var(--sl-ink); font-size: 26px; font-weight: 700; letter-spacing: -.025em; white-space: nowrap; }
    .sl-week-grid { flex: 1 1 auto; min-height: 0; margin-top: 14px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); gap: 8px; }
    .sl-week[data-mode="life"] .sl-week-grid { grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .sl-week-grid > .sl-message { grid-column: 1 / -1; }
    .sl-day {
      min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 10px 12px; overflow: hidden;
      border-radius: var(--sl-r-lane); background: var(--sl-cell);
    }
    .sl-day.is-today { background: var(--sl-sky-today); }
    .sl-day-head { flex: none; height: 24px; margin-bottom: 2px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .sl-day-name { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--sl-text); font-size: 13px; font-weight: 700; }
    .sl-day.is-weekend .sl-day-name { color: var(--sl-muted); }
    .sl-today-badge { padding: 1px 7px; border-radius: 999px; background: var(--sl-sky); color: #FFFFFF; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .sl-day-count { flex: none; color: var(--sl-muted); font-size: 12px; white-space: nowrap; }
    .sl-day-item { flex: none; height: 28px; display: flex; align-items: center; gap: 4px; min-width: 0; }
    .sl-dot-button {
      flex: none; width: 28px; height: 28px; margin-left: -9px; padding: 0; border: 0; background: transparent;
      display: flex; align-items: center; justify-content: center;
    }
    .sl-dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--sl-dot); background: var(--sl-surface); }
    .sl-dot-button.is-on .sl-dot { border-color: var(--sl-sky); background: var(--sl-sky); }
    .sl-day-item .sl-num { width: 16px; height: 16px; margin-left: -4px; font-size: 10px; }
    .sl-day-text { flex: 1; min-width: 0; margin-left: -4px; overflow: hidden; color: var(--sl-muted); font-size: 13px; white-space: nowrap; text-overflow: ellipsis; }
    .sl-day-item .sl-num + .sl-day-text { margin-left: 2px; }
    .sl-day-item.is-done .sl-day-text { color: var(--sl-text); }
    .sl-day-more { flex: none; height: 24px; display: flex; align-items: center; color: var(--sl-quiet); font-size: 12px; }
    .sl-day-empty { flex: none; height: 28px; display: flex; align-items: center; color: var(--sl-empty); font-size: 13px; }
    /* 지난 요일의 이월 업무: 흐린 글자 + 빈 원(누를 수 없음) */
    .sl-day-item.is-carry .sl-day-text { color: var(--sl-quiet); }
    .sl-day-item.is-carry .sl-dot-button { cursor: default; }

    /* 좁은 폭(640px 미만, 일상은 7열이라 700px 미만. AGENTS.md 반응형 기준): 요일 줄(완료 점 + 숫자, 업무 5줄·일상 7줄) + 이번 주 요약. 위의 넓은 폭 규칙은 그대로. */
    .sl-week-compact { flex: 1 1 auto; min-height: 0; margin-top: 12px; display: flex; flex-direction: column; }
    .sl-week-compact[hidden], .sl-week.is-compact .sl-week-grid { display: none; }
    .sl-week.is-compact { padding: 18px 18px 16px; }
    .sl-week.is-compact .sl-week-titlebar { margin-top: 12px; }
    .sl-week.is-compact .sl-week-title { font-size: 22px; }
    /* 한 줄 44px, 남는 높이는 줄 사이에 고르게(낮은 임베드에서는 줄이 줄어든다) */
    .sl-wk-rows { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; }
    .sl-wk-rows > .sl-message { padding-top: 8px; }
    .sl-wk-row { flex: 0 1 44px; min-height: 30px; margin: 0 -8px; padding: 0 8px; border-radius: 10px; display: flex; align-items: center; gap: 14px; }
    /* 일상 7줄: 위젯 높이는 그대로, 줄 최소 높이만 낮춰 같은 자리에 맞춘다 */
    .sl-week[data-mode="life"] .sl-wk-row { min-height: 20px; }
    .sl-wk-row.is-today { background: var(--sl-sky-today); }
    .sl-wk-dow { flex: none; width: 16px; color: var(--sl-text); font-size: 14px; font-weight: 700; }
    .sl-wk-row.is-weekend .sl-wk-dow { color: var(--sl-muted); }
    .sl-wk-row.is-empty .sl-wk-dow { color: var(--sl-empty); }
    .sl-wk-dots { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 5px; overflow: hidden; }
    .sl-wk-dot { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--sl-sky); }
    .sl-wk-dot.is-open { border: 1.5px solid var(--sl-check); background: var(--sl-surface); }
    .sl-wk-plus { flex: none; margin-left: 1px; color: var(--sl-muted); font-size: 11px; white-space: nowrap; }
    .sl-wk-count { flex: none; color: var(--sl-muted); font-size: 12px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .sl-wk-sum { flex: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--sl-line); display: flex; justify-content: space-between; gap: 12px; color: var(--sl-muted); font-size: 13px; white-space: nowrap; }
    .sl-wk-sum b { color: var(--sl-ink); font-weight: 700; }
  </style>
  <script src="../../store.js?v=20260930-size-sync" data-store-isolated data-store-coalesce></script>
</head>
<body>
  <main class="sl-root sl-week" id="app" data-status="loading" aria-label="이번 주 한 일">
    <div class="sl-head-row sl-week-head">
      <nav class="sl-nav" aria-label="주 이동">
        <button class="sl-arrow" type="button" data-week="-1" aria-label="이전 주">‹</button>
        <span class="sl-nav-label" id="range"></span>
        <button class="sl-arrow" type="button" data-week="1" aria-label="다음 주">›</button>
      </nav>
      <div id="modeToggle"></div>
    </div>
    <div class="sl-title-wrap sl-week-titlebar"><h1 class="sl-week-title">이번 주 한 일</h1><span class="sl-notice" id="notice"></span></div>
    <div class="sl-week-grid" id="days"><p class="sl-message">불러오는 중이에요</p></div>
    <div class="sl-week-compact" id="compact" hidden>
      <div class="sl-wk-rows" id="weekRows"></div>
      <div class="sl-wk-sum" id="weekSum"></div>
    </div>
    <div class="sl-sr" id="live" aria-live="polite"></div>
  </main>
  <script src="../../widget-frame.js?v=20260930-mobile-layout"></script>
  <script type="module" src="week-review.mjs?v=20261018-life-week"></script>
</body>
</html>

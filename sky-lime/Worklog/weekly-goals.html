<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이번 주 목표</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="../../widget-frame.css?v=20260930-mobile-layout">
  <link rel="stylesheet" href="sky-lime.css?v=20261014-sky-lime">
  <style>
    /* 위쪽 50px은 캐릭터 자리. 카드(130px)와 합쳐 기본 높이 180px.
       이미지 위아래 투명 여백을 빼고 보이는 캐릭터가 약 60px(0~61px)이 되게 놓아, 앞발이 카드 윗변에 걸친다. */
    .sl-goals-page { position: relative; height: 100%; display: flex; flex-direction: column; padding-top: 50px; }
    .sl-character {
      position: absolute; right: 44px; top: -9px; z-index: 2; display: block; width: auto; height: 76px;
      pointer-events: none; user-select: none; -webkit-user-drag: none;
    }
    .sl-goals { flex: 1 1 auto; height: auto; min-height: 0; gap: 10px; padding: 14px 18px 12px 22px; }
    .sl-goals-head { flex: none; height: 28px; }
    .sl-goals-title { margin: 0; color: var(--sl-ink); font-size: 16px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
    .sl-goals-grid { flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    .sl-goal {
      min-width: 0; height: 64px; display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px;
      border-radius: var(--sl-r-card); background: var(--sl-cell);
    }
    .sl-goal .sl-num { width: 18px; height: 18px; margin-top: 1px; font-size: 11px; }
    .sl-goal-text {
      flex: 1; min-width: 0; overflow: hidden; color: var(--sl-ink); font-size: 13px; font-weight: 600; line-height: 20px;
      letter-spacing: -.01em; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
      word-break: keep-all; overflow-wrap: anywhere;
    }
    .sl-goal.is-done .sl-goal-text { color: var(--sl-hint); }
    .sl-goal-more { background: var(--sl-more); color: var(--sl-hint); font-size: 13px; line-height: 20px; }
    .sl-goals-grid > .sl-message { grid-column: 1 / -1; height: 20px; margin: 0; line-height: 20px; }
  </style>
  <script src="../../store.js?v=20260930-size-sync" data-store-isolated data-store-coalesce></script>
</head>
<body>
  <main class="sl-goals-page">
    <img class="sl-character" src="../assets/character.png" alt="" aria-hidden="true">
    <section class="sl-root sl-goals" id="app" data-status="loading" aria-label="이번 주 목표">
      <div class="sl-head-row sl-goals-head">
        <div class="sl-title-wrap"><h1 class="sl-goals-title">이번 주 목표</h1><span class="sl-notice" id="notice"></span></div>
        <div id="modeToggle"></div>
      </div>
      <div class="sl-goals-grid" id="goals"><p class="sl-message">불러오는 중이에요</p></div>
    </section>
  </main>
  <script src="../../widget-frame.js?v=20260930-mobile-layout"></script>
  <script type="module" src="weekly-goals.mjs?v=20261014-sky-lime"></script>
</body>
</html>

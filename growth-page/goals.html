<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4단 목표 계층</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root {
      --action:#0E5C7A; --action-soft:#E2F0F6; --text:#12303C; --secondary:#6B8794;
      --muted:#93A5AD; --faint:#A2B4BC; --done:#A9BAC2; --border:#DCE7ED;
      --border-soft:#EDF2F4; --surface:#FFFFFF; --surface-soft:#FAFCFD; --danger:#A56B6B;
    }
    * { box-sizing:border-box; }
    html,body { width:100%; min-height:100%; }
    body { margin:0; color:var(--text); background:transparent; font-family:"Pretendard Variable",-apple-system,"Helvetica Neue",sans-serif; -webkit-font-smoothing:antialiased; }
    button,input { font:inherit; color:inherit; }
    .card { width:100%; min-height:420px; display:flex; flex-direction:column; gap:12px; padding:18px; overflow:hidden; background:var(--surface); border-radius:18px; box-shadow:0 1px 2px rgba(18,48,60,.04),0 6px 18px rgba(18,48,60,.06); }
    .header { min-height:30px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .year-title { font-size:15px; font-weight:850; }
    .summary { display:flex; align-items:center; justify-content:flex-end; margin-left:auto; color:var(--secondary); font-size:11px; font-weight:750; text-align:right; white-space:nowrap; }
    .goals-grid { min-height:0; display:grid; flex:1 1 auto; grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px; }
    .goal-column { min-width:0; min-height:338px; display:flex; flex-direction:column; padding:11px; background:var(--surface-soft); border:1px solid var(--border-soft); border-radius:14px; }
    .goal-column.accent { background:var(--surface); border-color:#CFE2EA; }
    .goal-column.past { opacity:.5; }
    .column-head { min-height:28px; display:flex; align-items:center; gap:6px; padding:0 1px 8px; }
    .column-label { font-size:11px; font-weight:850; }
    .goal-column.accent .column-label { color:var(--action); }
    .column-count { color:var(--faint); font-size:9px; font-weight:750; }
    .past-label { margin-left:auto; color:var(--muted); font-size:9px; font-weight:750; }
    .goal-list { min-height:0; display:flex; flex:1 1 auto; flex-direction:column; gap:3px; overflow-x:hidden; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
    .empty { min-height:72px; display:grid; place-items:center; flex:1 1 auto; color:var(--faint); border:1px dashed var(--border); border-radius:10px; font-size:10px; font-weight:700; }
    .goal-row { min-width:0; min-height:39px; display:flex; align-items:center; gap:5px; padding:5px 4px; border-bottom:1px solid var(--border-soft); }
    .goal-row.has-link { min-height:47px; align-items:flex-start; }
    .goal-row.has-link .check { margin-top:1px; }
    .goal-row.done { opacity:.56; }
    .check { width:26px; height:28px; display:grid; flex:0 0 26px; place-items:center; padding:0; border:0; background:transparent; cursor:pointer; }
    .check::before { content:""; width:14px; height:14px; background:var(--surface); border:1.5px solid #C6D6DD; border-radius:50%; }
    .goal-row.done .check::before { background:#C6D6DD; }
    .goal-copy { min-width:0; display:flex; flex:1 1 auto; flex-direction:column; gap:2px; }
    .goal-name { position:relative; min-width:0; width:100%; padding:0; overflow:hidden; border:0; background:transparent; font-size:11px; font-weight:650; text-align:left; text-overflow:ellipsis; white-space:nowrap; cursor:text; }
    .goal-name::after { content:""; position:absolute; left:0; top:50%; width:0; height:1px; background:var(--done); transition:width var(--t-open) var(--ease); }
    .goal-row.done .goal-name { color:var(--done); }
    .goal-row.done .goal-name::after { width:100%; }
    .goal-link { width:100%; overflow:hidden; color:var(--muted); font-size:9px; font-weight:700; line-height:1.3; text-overflow:ellipsis; white-space:nowrap; }
    .edit-input { min-width:0; height:29px; flex:1 1 auto; padding:0 8px; border:1px solid #CFE2EA; border-radius:8px; outline:0; background:#F7FBFD; font-size:11px; font-weight:650; }
    .text-action { min-height:28px; padding:0 3px; border:0; background:transparent; color:var(--muted); font-size:9px; font-weight:750; cursor:pointer; }
    .text-action.danger { color:var(--danger); }
    .column-footer { display:flex; flex-direction:column; gap:6px; padding-top:7px; }
    .add-trigger { min-height:29px; width:100%; padding:0 4px; border:1px dashed transparent; border-radius:8px; background:transparent; color:var(--muted); font-size:10px; font-weight:750; text-align:left; cursor:pointer; }
    .add-trigger:hover,.add-trigger:focus-visible { border-color:#CFE2EA; }
    .composer { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:5px; }
    .composer.has-parent { grid-template-columns:minmax(0,1fr); }
    .composer-input { width:100%; height:31px; min-width:0; padding:0 8px; border:1px solid var(--border); border-radius:8px; outline:0; background:var(--surface); font-size:10px; font-weight:650; }
    .parent-picker { min-width:0; display:flex; flex-direction:column; gap:4px; }
    .parent-trigger { width:100%; min-height:31px; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 8px; overflow:hidden; border:1px solid var(--border); border-radius:8px; outline:0; background:var(--surface); color:var(--secondary); font-size:10px; font-weight:700; text-align:left; cursor:pointer; }
    .parent-trigger:hover,.parent-trigger:focus-visible,.parent-trigger[aria-expanded="true"] { border-color:var(--action); }
    .parent-label { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .parent-caret { flex:0 0 auto; color:var(--muted); font-size:10px; }
    .parent-options { max-height:126px; display:flex; flex-direction:column; gap:4px; padding:5px; overflow-y:auto; border:1px solid var(--border-soft); border-radius:9px; background:var(--surface-soft); scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
    .parent-options[hidden] { display:none; }
    .parent-option { width:100%; min-height:29px; padding:5px 7px; overflow:hidden; border:1px solid transparent; border-radius:8px; background:transparent; color:var(--secondary); font-size:9px; font-weight:700; text-align:left; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
    .parent-option:hover,.parent-option:focus-visible { border-color:#CFE2EA; outline:0; }
    .parent-option.is-selected { border-color:#CFE2EA; background:var(--action-soft); color:var(--action); }
    .composer-actions { display:flex; justify-content:flex-end; gap:5px; }
    .composer:not(.has-parent) .composer-actions { display:contents; }
    .small-button { min-height:31px; padding:0 8px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--muted); font-size:9px; font-weight:750; cursor:pointer; }
    .small-button.primary { border-color:var(--action); background:var(--action); color:white; }
    .bottom-line { min-height:24px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .past-toggle { display:none; padding:0; border:0; background:transparent; color:var(--muted); font-size:10px; font-weight:750; cursor:pointer; }
    .undo { margin-left:auto; color:var(--done); font-size:9px; font-weight:700; }
    .undo button { padding:0; border:0; background:transparent; color:var(--action); font-size:9px; font-weight:750; cursor:pointer; }
    @media (any-pointer: coarse) and (max-width:1199px) { .goals-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (any-pointer: coarse) and (max-width:699px) {
      .card { min-height:540px; padding:14px; }
      .goals-grid { grid-template-columns:1fr; }
      .goal-column.mobile-secondary { display:none; }
      .goals-grid.show-past .goal-column.mobile-secondary { display:flex; }
      .past-toggle { display:block; }
      .goal-column { min-height:230px; }
    }
    body.is-widget-mobile .card { min-height:500px; height:auto; padding:12px; gap:10px; }
    body.is-widget-mobile .header { min-height:44px; }
    body.is-widget-mobile .year-title { color:var(--text); font-size:15px; font-weight:800; }
    body.is-widget-mobile .summary { color:var(--secondary); font-size:11px; font-weight:700; }
    body.is-widget-mobile .goals-grid { min-height:390px; display:flex; flex-direction:column; gap:10px; }
    body.is-widget-mobile .mobile-goal-segments { flex:0 0 auto; height:34px; padding:3px; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:2px; border-radius:999px; background:#F5F9FB; }
    body.is-widget-mobile .mobile-goal-segment { position:relative; height:44px; min-height:44px; margin:-5px 0; padding:0 5px; border:0; border-radius:999px; background:transparent; color:var(--secondary); font-size:11px; font-weight:700; isolation:isolate; }
    body.is-widget-mobile .mobile-goal-segment::before { content:""; position:absolute; z-index:-1; inset:8px 0; border-radius:999px; background:transparent; }
    body.is-widget-mobile .mobile-goal-segment.is-selected { background:transparent; color:var(--action); box-shadow:none; }
    body.is-widget-mobile .mobile-goal-segment.is-selected::before { background:var(--surface); box-shadow:0 1px 2px rgba(18,48,60,.05); }
    body.is-widget-mobile .mobile-goal-segment.is-past { opacity:.55; }
    body.is-widget-mobile .mobile-goal-list { min-height:0; flex:1; padding:4px; overflow-y:auto; display:flex; flex-direction:column; background:var(--surface-soft); border:1px solid var(--border-soft); border-radius:12px; }
    body.is-widget-mobile .mobile-goal-row { height:48px; min-height:48px; display:grid; grid-template-columns:44px minmax(0,1fr); align-items:center; }
    body.is-widget-mobile .mobile-goal-row + .mobile-goal-row { border-top:1px solid var(--border-soft); }
    body.is-widget-mobile .mobile-goal-check { position:relative; width:44px; height:48px; padding:0; border:0; background:transparent; }
    body.is-widget-mobile .mobile-goal-check::before { content:""; position:absolute; left:50%; top:50%; width:24px; height:24px; border:1.5px solid #C6D6DD; border-radius:7px; background:var(--surface); transform:translate(-50%,-50%); }
    body.is-widget-mobile .mobile-goal-row.done .mobile-goal-check::before { border-color:var(--action); background:var(--action); }
    body.is-widget-mobile .mobile-goal-row.done .mobile-goal-check::after { content:"✓"; position:absolute; left:50%; top:50%; color:#FFFFFF; font-size:11px; font-weight:800; transform:translate(-50%,-50%); }
    body.is-widget-mobile .mobile-goal-name { min-width:0; padding-right:8px; overflow:hidden; color:var(--text); font-size:15px; font-weight:600; text-overflow:ellipsis; white-space:nowrap; }
    body.is-widget-mobile .mobile-goal-row.done .mobile-goal-name { color:var(--done); text-decoration:line-through; }
    body.is-widget-mobile .mobile-goal-empty { min-height:90px; display:grid; place-items:center; color:var(--muted); font-size:11px; font-weight:700; }
    body.is-widget-mobile .mobile-goal-add { height:48px; flex:0 0 48px; display:grid; grid-template-columns:44px minmax(0,1fr); align-items:center; border:1px dashed #C6D6DD; border-radius:12px; }
    body.is-widget-mobile .mobile-goal-plus { color:var(--muted); font-size:16px; text-align:center; }
    body.is-widget-mobile .mobile-goal-input { width:100%; height:46px; padding:0 10px 0 0; border:0; outline:0; background:transparent; color:var(--text); font-size:16px; font-weight:600; }
    body.is-widget-mobile .bottom-line { display:none; }
  </style>
  <link rel="stylesheet" href="../widget-frame.css">
</head>
<body class="widget-page widget-page-centered">
  <div class="widget-host" data-widget-host data-widget-mobile data-widget-key="widget-size-goals.html" data-widget-max-width="1400" data-widget-height="420" style="--widget-max-width:1400px;--widget-base-width:1400px;--widget-base-height:420px;--widget-visual-height:420px">
    <main class="card" id="card" data-widget-card aria-label="4단 목표 계층 위젯">
      <header class="header" id="header"></header>
      <section class="goals-grid" id="goalsGrid" aria-live="polite"></section>
      <div class="bottom-line" id="bottomLine"></div>
      <span class="widget-size-label" data-widget-size-label aria-hidden="true"></span>
      <button class="widget-size-handle" data-widget-scale-handle type="button" aria-label="위젯 비율 고정 크기 조절" aria-valuemin="70" aria-valuemax="100"></button>
    </main>
  </div>
  <script src="../store.js?v=20260903-store-errors"></script>
  <script>
    (() => {
      'use strict';
      const now=new Date();
      const currentHalf=now.getMonth()<6?'h1':'h2';
      const columns=[
        {scope:'year',label:'올해'},
        {scope:'h1',label:'상반기'},
        {scope:'h2',label:'하반기'},
        {scope:'month',label:'이번 달'}
      ];
      const card=document.getElementById('card');
      const header=document.getElementById('header');
      const grid=document.getElementById('goalsGrid');
      const bottom=document.getElementById('bottomLine');
      let state={goals:[]};
      let saveTimer=0;
      let revision=0;
      let saving=false;
      let knownGoalIds=new Set();
      let syncSignature='';
      const ui={editing:'',composer:'',undo:null,showPast:false,mobileScope:'month'};
      const isMobileLayout=()=>document.body.classList.contains('is-widget-mobile');

      function id(){return `g-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;}
      function clone(value){return JSON.parse(JSON.stringify(value));}
      function esc(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
      function normalize(raw){
        const valid=['year','h1','h2','month'];
        return {goals:(Array.isArray(raw?.goals)?raw.goals:[]).filter(goal=>goal&&valid.includes(goal.scope)).map(goal=>({
          id:String(goal.id||id()), scope:goal.scope, t:String(goal.t??''), done:Boolean(goal.done),
          parent:goal.scope==='year'?null:(goal.parent?String(goal.parent):null),
          createdAt:Number(goal.createdAt)||Date.now(),
          completedAt:goal.done&&goal.completedAt?String(goal.completedAt):null
        }))};
      }
      function save(){state=normalize(state);revision+=1;clearTimeout(saveTimer);saveTimer=setTimeout(persist,180);}
      async function persist(){saveTimer=0;if(saving)return;saving=true;const current=revision,snapshot=normalize(state),nextIds=new Set(snapshot.goals.map(goal=>goal.id)),added=snapshot.goals.filter(goal=>!knownGoalIds.has(goal.id));try{let indexScope='week';if(added.length){try{const index=await Store.loadIndexState();indexScope=index?.scope==='month'?'month':'week';}catch(_){}}await Store.saveGoalState(snapshot);if(added.length)await Promise.all(added.map(goal=>Store.updateIndexItem(`goal:${goal.id}`,{scope:indexScope})));knownGoalIds=nextIds;}catch(_){}saving=false;if(revision!==current)persist();}
      async function sync(){if(saving||saveTimer)return;try{const nextState=normalize(await Store.loadGoalState()),nextSignature=JSON.stringify(nextState);if(nextSignature===syncSignature)return;syncSignature=nextSignature;state=nextState;knownGoalIds=new Set(state.goals.map(goal=>goal.id));render();}catch(_){} }
      function byId(goalId){return state.goals.find(goal=>goal.id===goalId)||null;}
      function goalsFor(scope){return state.goals.filter(goal=>goal.scope===scope).sort((a,b)=>Number(a.done)-Number(b.done)||a.createdAt-b.createdAt);}
      function descendants(rootId){
        const found=new Set([rootId]); let changed=true;
        while(changed){changed=false;state.goals.forEach(goal=>{if(goal.parent&&found.has(goal.parent)&&!found.has(goal.id)){found.add(goal.id);changed=true;}});}
        return found;
      }
      function parentOptions(scope){
        if(scope==='h1'||scope==='h2')return goalsFor('year');
        if(scope==='month')return goalsFor(currentHalf);
        return [];
      }
      function linkMeta(goal){
        const parent=byId(goal.parent);
        if(goal.scope==='h1'||goal.scope==='h2')return parent?`연간 · ${parent.t}`:'연간 연결 없음';
        return parent?`구간 · ${parent.t}`:'구간 연결 없음';
      }
      function renderHeader(){
        const total=state.goals.length,done=state.goals.filter(goal=>goal.done).length;
        header.innerHTML=`<div class="year-title">${now.getFullYear()}${isMobileLayout()?' 목표':''}</div><div class="summary"><span>${isMobileLayout()?`${done} / ${total} 달성`:`${total}개 중 ${done}개 완료`}</span></div>`;
      }
      function row(goal){
        if(ui.editing===goal.id)return `<div class="goal-row${goal.done?' done':''}" data-row="${esc(goal.id)}"><button class="check" type="button" data-toggle="${esc(goal.id)}" aria-label="완료 상태 변경"></button><input class="edit-input" data-edit-input="${esc(goal.id)}" value="${esc(goal.t)}"><button class="text-action danger" type="button" data-delete-request="${esc(goal.id)}">삭제</button><button class="text-action" type="button" data-edit-done>완료</button></div>`;
        if(goal.scope==='year')return `<div class="goal-row${goal.done?' done':''}" data-row="${esc(goal.id)}"><button class="check" type="button" data-toggle="${esc(goal.id)}" aria-label="완료 상태 변경"></button><button class="goal-name" type="button" data-edit="${esc(goal.id)}">${esc(goal.t)}</button></div>`;
        return `<div class="goal-row has-link${goal.done?' done':''}" data-row="${esc(goal.id)}"><button class="check" type="button" data-toggle="${esc(goal.id)}" aria-label="완료 상태 변경"></button><div class="goal-copy"><button class="goal-name" type="button" data-edit="${esc(goal.id)}">${esc(goal.t)}</button><span class="goal-link">${esc(linkMeta(goal))}</span></div></div>`;
      }
      function composer(scope){
        const options=parentOptions(scope);
        const emptyLabel=scope==='month'?'구간 연결 없음':'연간 연결 없음';
        const picker=scope==='year'?'':`<div class="parent-picker" data-parent-picker><button class="parent-trigger" type="button" data-parent-toggle aria-expanded="false"><span class="parent-label" data-parent-label>${emptyLabel}</span><span class="parent-caret" aria-hidden="true">⌄</span></button><div class="parent-options" data-parent-options hidden><button class="parent-option is-selected" type="button" data-parent-option="">${emptyLabel}</button>${options.map(goal=>`<button class="parent-option" type="button" data-parent-option="${esc(goal.id)}">${esc(goal.t)}</button>`).join('')}</div></div>`;
        return `<div class="composer${picker?' has-parent':''}" data-composer="${scope}" data-parent-value=""><input class="composer-input" data-new-goal placeholder="${columns.find(column=>column.scope===scope).label} 목표">${picker}<div class="composer-actions"><button class="small-button primary" type="button" data-add="${scope}">추가</button><button class="small-button" type="button" data-compose-cancel>취소</button></div></div>`;
      }
      function renderGrid(){
        if(isMobileLayout()){
          const scope=ui.mobileScope;
          const goals=goalsFor(scope);
          const segments=columns.map(column=>`<button class="mobile-goal-segment${scope===column.scope?' is-selected':''}${column.scope==='h1'&&currentHalf==='h2'?' is-past':''}" type="button" data-mobile-scope="${column.scope}" aria-pressed="${scope===column.scope}">${column.label}</button>`).join('');
          const rows=goals.length?goals.map(goal=>`<div class="mobile-goal-row${goal.done?' done':''}" data-row="${esc(goal.id)}"><button class="mobile-goal-check" type="button" data-toggle="${esc(goal.id)}" aria-label="완료 상태 변경"></button><span class="mobile-goal-name">${esc(goal.t)}</span></div>`).join(''):'<div class="mobile-goal-empty">목표가 없습니다</div>';
          const label=columns.find(column=>column.scope===scope)?.label||'목표';
          grid.className='goals-grid';
          grid.innerHTML=`<div class="mobile-goal-segments">${segments}</div><div class="mobile-goal-list">${rows}</div><form class="mobile-goal-add" data-mobile-goal-form><span class="mobile-goal-plus" aria-hidden="true">＋</span><input class="mobile-goal-input" name="title" placeholder="${label} 목표 추가 후 엔터" aria-label="${label} 목표 추가" autocomplete="off"></form>`;
          return;
        }
        grid.classList.toggle('show-past',ui.showPast);
        grid.innerHTML=columns.map(column=>{
          const goals=goalsFor(column.scope);
          const isPast=column.scope==='h1'&&currentHalf==='h2';
          const isAccent=column.scope===currentHalf||column.scope==='month';
          const mobileSecondary=column.scope!==currentHalf&&column.scope!=='month';
          return `<section class="goal-column${isAccent?' accent':''}${isPast?' past':''}${mobileSecondary?' mobile-secondary':''}" data-column="${column.scope}"><header class="column-head"><span class="column-label">${column.label}</span><span class="column-count">${goals.length}</span>${isPast?'<span class="past-label">지난 구간</span>':''}</header><div class="goal-list">${goals.length?goals.map(row).join(''):`<div class="empty">목표가 없습니다</div>`}</div><footer class="column-footer">${ui.composer===column.scope?composer(column.scope):`<button class="add-trigger" type="button" data-compose-open="${column.scope}">＋ 목표 추가</button>`}</footer></section>`;
        }).join('');
      }
      function renderBottom(){
        bottom.innerHTML=`<button class="past-toggle" type="button" data-past-toggle>${ui.showPast?'현재 구간만 보기':'지난 구간 보기'}</button>${ui.undo?`<span class="undo">‘${esc(ui.undo.name)}’ 삭제됨 · <button type="button" data-undo>되돌리기</button></span>`:''}`;
      }
      function render(focus=''){renderHeader();renderGrid();renderBottom();if(focus)requestAnimationFrame(()=>card.querySelector(focus)?.focus());}
      function add(scope){
        const box=card.querySelector(`[data-composer="${scope}"]`),input=box?.querySelector('[data-new-goal]');
        const title=input?.value.trim();if(!title){input?.focus();return;}
        const parent=box?.dataset.parentValue||null;
        const goal={id:id(),scope,t:title,done:false,parent,createdAt:Date.now(),completedAt:null};state.goals.push(goal);ui.composer='';ui.undo=null;save();render();const rowNode=card.querySelector(`[data-row="${CSS.escape(goal.id)}"]`);if(rowNode){widgetMotion.popIn(rowNode);rowNode.classList.add('motion-new');setTimeout(()=>rowNode.classList.remove('motion-new'),900);}
      }
      function remove(goalId,mode='unlink'){
        const goal=byId(goalId);if(!goal)return;
        const previous=clone(state.goals);
        if(mode==='cascade'){const removing=descendants(goal.id);state.goals=state.goals.filter(item=>!removing.has(item.id));}
        else {state.goals.forEach(item=>{if(item.parent===goal.id)item.parent=null;});state.goals=state.goals.filter(item=>item.id!==goal.id);}
        ui.undo={name:goal.t,goals:previous};ui.editing='';save();render();
      }
      card.addEventListener('click',event=>{
        const target=event.target;
        const parentToggle=target.closest('[data-parent-toggle]');if(parentToggle){const picker=parentToggle.closest('[data-parent-picker]'),options=picker?.querySelector('[data-parent-options]'),opening=parentToggle.getAttribute('aria-expanded')!=='true';parentToggle.setAttribute('aria-expanded',String(opening));if(options)options.hidden=!opening;return;}
        const parentOption=target.closest('[data-parent-option]');if(parentOption){const box=parentOption.closest('[data-composer]'),picker=parentOption.closest('[data-parent-picker]'),trigger=picker?.querySelector('[data-parent-toggle]'),label=picker?.querySelector('[data-parent-label]');if(box)box.dataset.parentValue=parentOption.dataset.parentOption||'';picker?.querySelectorAll('[data-parent-option]').forEach(option=>option.classList.toggle('is-selected',option===parentOption));if(label)label.textContent=parentOption.textContent.trim();if(trigger)trigger.setAttribute('aria-expanded','false');const options=picker?.querySelector('[data-parent-options]');if(options)options.hidden=true;trigger?.focus();return;}
        card.querySelectorAll('[data-parent-toggle][aria-expanded="true"]').forEach(trigger=>{trigger.setAttribute('aria-expanded','false');const options=trigger.closest('[data-parent-picker]')?.querySelector('[data-parent-options]');if(options)options.hidden=true;});
        const toggle=target.closest('[data-toggle]');if(toggle){const goal=byId(toggle.dataset.toggle);if(goal){goal.done=!goal.done;goal.completedAt=goal.done?new Date().toISOString():null;ui.undo=null;save();const rowNode=toggle.closest('.goal-row');rowNode?.classList.toggle('done',goal.done);renderHeader();if(goal.done)widgetMotion.pop(toggle);const delay=matchMedia('(prefers-reduced-motion: reduce)').matches?0:260;setTimeout(()=>render(),delay);}return;}
        const mobileScope=target.closest('[data-mobile-scope]');if(mobileScope){ui.mobileScope=mobileScope.dataset.mobileScope;render();return;}
        const edit=target.closest('[data-edit]');if(edit){ui.editing=edit.dataset.edit;ui.composer='';render('[data-edit-input]');return;}
        if(target.closest('[data-edit-done]')){ui.editing='';render();return;}
        const del=target.closest('[data-delete-request]');if(del){const rowNode=del.closest('[data-row]'),removeNow=()=>remove(del.dataset.deleteRequest);if(rowNode&&window.widgetMotion?.close)window.widgetMotion.close(rowNode,removeNow);else removeNow();return;}
        if(target.closest('[data-undo]')&&ui.undo){state.goals=clone(ui.undo.goals);ui.undo=null;save();render();return;}
        const open=target.closest('[data-compose-open]');if(open){ui.composer=open.dataset.composeOpen;ui.editing='';render(`[data-composer="${ui.composer}"] [data-new-goal]`);return;}
        if(target.closest('[data-compose-cancel]')){ui.composer='';render();return;}
        const addButton=target.closest('[data-add]');if(addButton){add(addButton.dataset.add);return;}
        if(target.closest('[data-past-toggle]')){ui.showPast=!ui.showPast;render();}
      });
      card.addEventListener('input',event=>{const input=event.target.closest('[data-edit-input]');if(!input)return;const goal=byId(input.dataset.editInput);if(goal){goal.t=input.value;ui.undo=null;save();}});
      card.addEventListener('keydown',event=>{
        if(event.key==='Escape'&&event.target.closest('[data-parent-picker]')){const picker=event.target.closest('[data-parent-picker]'),trigger=picker.querySelector('[data-parent-toggle]'),options=picker.querySelector('[data-parent-options]');trigger?.setAttribute('aria-expanded','false');if(options)options.hidden=true;trigger?.focus();return;}
        if(event.target.matches('[data-new-goal]')&&event.key==='Enter'){event.preventDefault();add(event.target.closest('[data-composer]').dataset.composer);}
        if(event.target.matches('[data-edit-input]')&&(event.key==='Enter'||event.key==='Escape')){event.preventDefault();ui.editing='';render();}
      });
      card.addEventListener('submit',event=>{const form=event.target.closest('[data-mobile-goal-form]');if(!form)return;event.preventDefault();const input=form.querySelector('[name="title"]'),title=input?.value.trim();if(!title)return;const goal={id:id(),scope:ui.mobileScope,t:title,done:false,parent:null,createdAt:Date.now(),completedAt:null};state.goals.push(goal);ui.undo=null;save();render();requestAnimationFrame(()=>card.querySelector('[data-mobile-goal-form] input')?.focus({preventScroll:true}));});
      window.addEventListener('focus',sync);
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync();});
      Store.watch(sync);
      window.addEventListener('widgetlayoutchange',render);
      render();
      sync();
    })();
  </script>
  <script src="../widget-frame.js"></script>
</body>
</html>

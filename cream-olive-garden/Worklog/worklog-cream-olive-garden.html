          const index = fresh.tasks.findIndex(task => task.id === id);
          if (index < 0) return fresh;
          const next = { ...fresh.tasks[index] };
          const wasDone = next.done === true || next.status === 'done';
          updater(next);
          next.doneAt = next.done || next.status === 'done' ? (wasDone ? next.doneAt || next.date : calendarToday()) : null;
          const normalized = normalizeTask(next);
          fresh.tasks[index] = normalized;
          becameDone = !wasDone && normalized?.done === true;
          found = true;
          return fresh;
        });
        if (saved && found && announcement) announce(announcement);
        if (saved && found && becameDone && completionSource) animateTaskCompletion(id,completionSource);
        if (saved && !found) announce('다른 창에서 삭제된 항목입니다.');
        return saved && found;
      }

      function focusAddTitle() {
        const input = taskList.querySelector('[data-quick-add-form] [name="title"]');
        if (!input) return;
        input.focus({ preventScroll:true });
      }

      modeRow.addEventListener('click', event => {
        const button = event.target.closest('[data-mode]');
        if (!button) return;
        const nextMode = button.dataset.mode;
        const today = todayDate();
        if (nextMode === state.mode) {
          if (!drainPendingSync()) return;
          resetTransient();
          ui.selectedDate = localDateKey(clampDateToMode(today,state.mode));
          rememberView();
          renderAll();
          return;
        }
        const previousDate = ui.selectedDate;
        const previousUi = { adding:ui.adding, draftTask:ui.draftTask, editingId:ui.editingId, popover:ui.popover, dirtyFields:ui.dirtyFields };
        if (!drainPendingSync()) return;
        resetTransient();
        const followsClampedWorkToday = state.mode === 'work' && nextMode === 'life'
          && ui.selectedDate === localDateKey(clampDateToMode(today,'work'));
        const selected = followsClampedWorkToday ? today : clampDateToMode(parseDate(ui.selectedDate) || today,nextMode);
        ui.selectedDate = localDateKey(selected);
        const saved = mutate(fresh => { fresh.mode = nextMode; return fresh; });
        if (!saved) {
          ui.selectedDate = previousDate;
          Object.assign(ui, previousUi);
        } else {
          rememberView();
          window.widgetMotion?.pop?.(modeRow.querySelector('.mode-pill.is-selected'));
          animateListSwap();
        }
      });

      cardHeader.addEventListener('click', event => {
        const button = event.target.closest('[data-work-view]');
        if (!button || state.mode !== 'work') return;
        const nextView = button.dataset.workView;
        if (!['time','memo'].includes(nextView) || nextView === state.workView) return;
        if (!drainPendingSync()) return;
        if (state.workView === 'time' && nextView === 'memo' && !mobileQuery.matches) {
          const head = taskList.querySelector('.column-head.work.view-time');
          const title = head?.querySelector('[data-column-title]');
          const goal = head?.querySelector('[data-column-goal]');
          const status = head?.querySelector('[data-column-status]');
          if (head && title && goal && status) {
            timeTitleMeasurement = {
              headWidth:head.offsetWidth,
              titleWidth:title.offsetWidth,
              goalWidth:goal.offsetWidth,
              statusWidth:status.offsetWidth
            };
          }
        }
        resetTransient();
        state = { ...state, workView:nextView };
        renderWorkView();
        animateListSwap();
        persistWorkView(nextView);
        announce(`${nextView === 'memo' ? '메모' : '시간'} 보기로 전환했습니다.`);
      });

      previousDay.addEventListener('click', () => changeDate(-1));
      nextDayButton.addEventListener('click', () => changeDate(1));

      dayTrack.addEventListener('click', event => {
        const button = event.target.closest('[data-date]');
        if (!button) return;
        if (!drainPendingSync()) return;
        ui.selectedDate = button.dataset.date;
        resetTransient();
        rememberView();
        renderAll();
        animateDaySelection();
        dayTrack.querySelector('[data-day][aria-pressed="true"]')?.focus();
      });

      function deleteTaskNow(id) {
        const row = taskList.querySelector(`[data-task-id="${CSS.escape(id)}"]`);
        const remove = () => {
          if (ui.draftTask?.id === id) {
            cancelQuickAdd();
            return;
          }
          if (!drainPendingSync()) return;
          ui.editingId = null;
          const saved = mutate(fresh => { fresh.tasks = fresh.tasks.filter(task => task.id !== id); return fresh; });
          if (saved) announce('삭제했습니다.');
        };
        if (window.widgetMotion?.close && row) window.widgetMotion.close(row, remove);
        else remove();
      }

      function beginInlineEdit(id, field) {
        const task = taskById(id);
        if (!task) return;
        closeCellPopover();
        ui.inlineEdit = { taskId:id, field, original:String(task[field] || '') };
        renderAll();
        const input = taskList.querySelector(`[data-inline-task="${CSS.escape(id)}"][data-inline-field="${field}"]`);
        input?.focus({ preventScroll:true });
        input?.select();
      }

      function finishInlineEdit(input, save) {
        if (!input || !ui.inlineEdit) return;
        const { taskId, field } = ui.inlineEdit;
        if (input.dataset.inlineTask !== taskId || input.dataset.inlineField !== field) return;
        const raw = String(input.value || '');
        let value = raw.trim();
        if ((field === 'start' || field === 'end') && value) {
          value = parseTimeEntry(value);
          if (!value) save = false;
        }
        if (field === 'title' && !value) save = false;
        ui.inlineEdit = null;
        if (!save) {
          renderAll();
          return;
        }
        updateTask(taskId, task => {
          task[field] = value || (field === 'memo' ? '' : null);
          if (field === 'end' && !task.progressTouched && task.start && task.end) task.progress = durationOf(task);
        }, '수정했습니다.');
      }

      function openPopover(id, field) {
        const alreadyOpen = ui.popover?.taskId === id && ui.popover?.field === field;
        ui.inlineEdit = null;
        ui.projectAdding = false;
        ui.popover = alreadyOpen ? null : { taskId:id, field, month:field === 'due' ? String(taskById(id)?.due || localDateKey(todayDate())).slice(0,7) : '' };
        renderAll();
      }

      function adjustHours(delta) {
        if (!ui.popover || !['progress','est'].includes(ui.popover.field)) return;
        const { taskId, field } = ui.popover;
        updateTask(taskId, task => {
          const current = field === 'progress' ? progressOf(task) : task.est;
          const base = current ?? 0;
          const next = Math.min(24, Math.max(0, Math.round((base + delta) * 2) / 2));
          task[field] = delta < 0 && next <= 0 ? null : next;
          if (field === 'progress') task.progressTouched = true;
        }, `${field === 'progress' ? '진행' : '예상'} 시간을 바꿨습니다.`);
      }

      function trackEditorChange(event) {
        if (event.target.matches('textarea')) fitTextareas();
        if (typeof event.target.setCustomValidity === 'function') event.target.setCustomValidity('');
        if (event.target.matches?.('[data-quick-add-form] [name="title"]') && ui.draftTask) ui.draftTask.title = event.target.value;
        const form = event.target.closest?.('[data-task-form][data-kind="edit"]');
        if (form && event.target.name) ui.dirtyFields.add(event.target.name);
      }
      card.addEventListener('input', trackEditorChange);
      card.addEventListener('change', trackEditorChange);
      taskList.addEventListener('pointerdown', event => {
        const handle = event.target.closest('[data-column-resize]');
        if (handle) beginColumnResize(event,handle);
        else beginRowLongPress(event);
      });
      taskList.addEventListener('touchstart', event => {
        if (ui.longPress?.pointerType !== 'touch') return;
        const touch = event.changedTouches?.[0];
        if (touch) ui.longPress.touchId = touch.identifier;
      },{ passive:true });
      taskList.addEventListener('touchmove', event => {
        const drag = ui.rowDrag;
        if (!drag || drag.pointerType !== 'touch') return;
        const touch = touchForDrag(event,drag);
        if (!touch) return;
        event.preventDefault();
        updateRowDropAt(drag,touch.clientX,touch.clientY);
      },{ passive:false });
      taskList.addEventListener('touchend', event => {
        const drag = ui.rowDrag;
        if (!drag || drag.pointerType !== 'touch' || !touchForDrag(event,drag)) return;
        event.preventDefault();
        completeRowDrag(drag,false);
      },{ passive:false });
      taskList.addEventListener('touchcancel', event => {
        const drag = ui.rowDrag;
        if (!drag || drag.pointerType !== 'touch') return;
        completeRowDrag(drag,true);
      });
      taskList.addEventListener('contextmenu', event => {
        if (!event.target.closest('.task-row[data-task-id]:not(.quick-add-row)')) return;
        if (ui.longPress || ui.rowDrag) event.preventDefault();
      });
      document.addEventListener('pointermove', event => {
        moveColumnResize(event);
        moveLongPress(event);
      });
      document.addEventListener('pointerup', event => {
        endColumnResize(event);
        finishRowDrag(event,false);
      });
      document.addEventListener('pointercancel', event => {
        endColumnResize(event);
        if (ui.rowDrag?.pointerType === 'touch' && ui.rowDrag.pointerId === event.pointerId) return;
        finishRowDrag(event,true);
      });


      card.addEventListener('click', event => {
        if (Date.now() < ui.suppressClickUntil && event.target.closest('.task-row')) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return;
        }
        if (event.target.closest('[data-dismiss-banner]')) {
          const saved = mutate(fresh => { fresh.bannerDismissedDay = localDateKey(todayDate()); return fresh; }, false);
          if (saved) renderBanner();
          return;
        }
        const calendarNav = event.target.closest('[data-calendar-nav]');
        if (calendarNav && ui.popover?.field === 'due') {
          const month = calendarMonth(ui.popover.month);
          ui.popover.month = monthKey(new Date(month.getFullYear(), month.getMonth() + Number(calendarNav.dataset.calendarNav), 1, 12));
          renderCellPopover();
          return;
        }
        const projectNew = event.target.closest('[data-project-new]');
        if (projectNew && ui.popover?.field === 'project') {
          ui.projectAdding = true;
          renderCellPopover();
          const input = cellPopover.querySelector('.project-new-input');
          input?.focus();
          return;
        }
        const projectRemove = event.target.closest('[data-project-remove]');
        if (projectRemove) { removeProject(projectRemove.dataset.projectRemove); return; }
        const projectChoice = event.target.closest('[data-project-choice]');
        if (projectChoice && ui.popover) {
          const id = ui.popover.taskId;
          const value = projectChoice.dataset.projectChoice;
          closeCellPopover();
          if (updateTask(id, task => { task.proj = value || ''; }, '구분을 바꿨습니다.')) popTaskCell(id,'project');
          return;
        }
        const goalControl = event.target.closest('[data-goal-task]');
        if (goalControl) {
          const task = taskById(goalControl.dataset.goalTask);
          if (!task || task.mode !== 'work') return;
          if (updateTask(task.id, item => { item.goalId = nextTaskGoalId(item); }, taskGoalNumber(task) === 3 ? '이번 주 목표에서 해제했습니다.' : `이번 주 목표 ${taskGoalNumber(task) + 1}번으로 선택했습니다.`)) {
            taskList.querySelector(`[data-goal-task="${CSS.escape(task.id)}"]`)?.focus({ preventScroll:true });
          }
          return;
        }
        const qChoice = event.target.closest('[data-q-choice]');
        if (qChoice && ui.popover) {
          const id = ui.popover.taskId;
          const value = Number(qChoice.dataset.qChoice);
          closeCellPopover();
          if (updateTask(id, task => { task.q = value >= 1 && value <= 4 ? value : null; }, 'Q를 바꿨습니다.')) popTaskCell(id,'q');
          return;
        }
        const dateChoice = event.target.closest('[data-date-choice]');
        if (dateChoice && ui.popover) {
          const id = ui.popover.taskId;
          const value = dateChoice.dataset.dateChoice;
          closeCellPopover();
          if (updateTask(id, task => { task.due = parseDate(value) ? value : null; }, '마감을 바꿨습니다.')) popTaskCell(id,'due');
          return;
        }
        const adjustmentButton = event.target.closest('[data-adjust-hours]');
        if (adjustmentButton) {
          adjustHours(Number(adjustmentButton.dataset.adjustHours));
          return;
        }
        if (event.target.closest('[data-add-task]')) {
          if (ui.adding) {
            focusAddTitle();
            return;
          }
          if (!drainPendingSync()) return;
          resetTransient();
          ui.adding = true;
          ui.draftTask = createQuickDraft(state.mode);
          renderAll();
          window.setTimeout(focusAddTitle, 0);
          return;
        }
        const retry = event.target.closest('[data-time-retry]');
        if (retry) {
          const field = retry.dataset.timeRetry;
          updateTask(retry.dataset.taskId, task => {
            task[field] = currentTimeKey();
            if (field === 'end' && !task.progressTouched && task.start) task.progress = durationOf(task);
          }, `${field === 'start' ? '시작' : '종료'} 시간을 기록했습니다.`);
          return;
        }
        const clear = event.target.closest('[data-time-clear]');
        if (clear) {
          const field = clear.dataset.timeClear;
          updateTask(clear.dataset.taskId, task => {
            task[field] = null;
            if (field === 'end' && !task.progressTouched) task.progress = null;
          }, `${field === 'start' ? '시작' : '종료'} 시간을 비웠습니다.`);
          return;
        }
        const inlineStart = event.target.closest('[data-inline-start]');
        if (inlineStart) {
          if (event.shiftKey) {
            resetTransient();
            ui.editingId = inlineStart.dataset.taskId;
            renderAll();
            taskList.querySelector('[name="title"]')?.focus();
          } else beginInlineEdit(inlineStart.dataset.taskId, inlineStart.dataset.inlineStart);
          return;
        }
        const cellButton = event.target.closest('[data-cell-task][data-cell-field]');
        if (cellButton) {
          const id = cellButton.dataset.cellTask;
          const field = cellButton.dataset.cellField;
          if (['project','q','due','progress','est'].includes(field)) {
            openPopover(id, field);
            return;
          }
          if (field === 'start' || field === 'end') {
            beginInlineEdit(id, field);
            return;
          }
          if (field === 'status') {
            updateTask(id, task => {
              const next = task.status === 'wait' ? 'doing' : task.status === 'doing' ? 'done' : 'wait';
              task.status = next;
              task.done = next === 'done';
            }, '상태를 바꿨습니다.','status');
            return;
          }
        }
        const toggleButton = event.target.closest('[data-toggle-task]');
        if (toggleButton) {
          const id = toggleButton.dataset.toggleTask;
          updateTask(id, task => {
            task.done = !task.done;
            task.status = task.done ? 'done' : 'doing';
          }, '완료 상태를 바꿨습니다.','checkbox');
          return;
        }
        const rowDelete = event.target.closest('[data-row-delete], [data-delete-task]');
        if (rowDelete) {
          deleteTaskNow(rowDelete.dataset.rowDelete || rowDelete.dataset.deleteTask);
          return;
        }
        if (event.target.closest('[data-cancel-editor]')) {
          resetTransient();
          syncFromServer();
        }
      });

      card.addEventListener('submit', event => {
        const mobileAdd = event.target.closest('[data-mobile-add-form]');
        if (mobileAdd) {
          event.preventDefault();
          const title = String(new FormData(mobileAdd).get('title') || '').trim();
          if (!title || !drainPendingSync()) return;
          const task = { ...createQuickDraft(state.mode), title, proj:'', q:null, due:null, status:'wait', done:false, start:null, end:null, progress:null, est:null, memo:'' };
          const saved = mutate(fresh => { fresh.tasks.push(task); return fresh; });
          if (saved) {
            ui.newId = task.id;
            renderAll();
            window.setTimeout(() => { ui.newId = null; },900);
            addArea.querySelector('.mobile-add-input')?.focus({ preventScroll:true });
          }
          return;
        }
        const newProjectForm = event.target.closest('[data-project-new-form]');
        if (newProjectForm && ui.popover) {
          event.preventDefault();
          const id = ui.popover.taskId;
          const value = String(new FormData(newProjectForm).get('project') || '').trim();
          if (!value) return;
          const project = rememberProject(value);
          if (!project) return;
          closeCellPopover();

          event.preventDefault();
          saveQuickTask(quickForm, true);

        const form = event.target.closest('[data-task-form]');
        if (!form) return;

        const existing = state.tasks.find(task => task.id === form.dataset.taskId);

        if (!task?.title) return;
        resetTransient();
        mutate(fresh => {
          const index = fresh.tasks.findIndex(item => item.id === task.id);

      card.addEventListener('keydown', event => {
        if (event.isComposing || event.keyCode === 229) return;
        if (event.key === 'Enter' && event.shiftKey && event.target.matches('textarea')) return;
        const mobileInput = event.target.closest('.mobile-add-input');
        if (mobileInput && event.key === 'Enter') {
          event.preventDefault();
          if (mobileInput.value.trim()) mobileInput.form.requestSubmit();
          else mobileInput.blur();
          return;
        }
        if (mobileInput && event.key === 'Escape') {
          event.preventDefault();
          mobileInput.value = '';
          mobileInput.blur();
          fitTextareas();
          return;
        }
        const quickInput = event.target.closest('[data-quick-add-form] [name="title"]');
        if (quickInput && event.key === 'Enter') {
          event.preventDefault();
          const form = quickInput.closest('[data-quick-add-form]');
          if (quickInput.value.trim()) saveQuickTask(form, true);
          else cancelQuickAdd();
          return;
        }
        if (quickInput && event.key === 'Escape') {
          event.preventDefault();
          cancelQuickAdd();
          return;
        }
        const inlineInput = event.target.closest('[data-inline-input]');
        if (inlineInput && (event.key === 'Enter' || event.key === 'Escape')) {
          event.preventDefault();
          finishInlineEdit(inlineInput, event.key === 'Enter');
        }
      });

      card.addEventListener('focusout', event => {
        const inlineInput = event.target.closest('[data-inline-input]');
        if (inlineInput) {
          window.setTimeout(() => { if (ui.inlineEdit && !inlineInput.contains(document.activeElement)) finishInlineEdit(inlineInput, true); }, 0);
          return;
        }
        const form = event.target.closest('[data-quick-add-form]');
        if (!form || !event.target.matches('[name="title"]')) return;
        window.setTimeout(() => {
          if (!ui.adding || !form.isConnected || form.contains(document.activeElement)) return;
          if (!String(event.target.value || '').trim()) cancelQuickAdd();

      document.addEventListener('pointerdown', event => {
        if (ui.popover && !event.target.closest('#cellPopover, [data-cell-task][data-cell-field]')) closeCellPopover();

      document.addEventListener('keydown', event => {
        if (event.isComposing) return;
        const columnHandle = event.target.closest?.('[data-column-resize]');
        if (columnHandle && ['ArrowLeft','ArrowRight'].includes(event.key)) {
          event.preventDefault();
          const mode = columnHandle.dataset.columnResize === 'life' ? 'life' : 'work';
          const direction = event.key === 'ArrowRight' ? 1 : -1;
          setColumnSplit(mode,(state.columnSplit?.[mode] ?? DEFAULT_COLUMN_SPLIT[mode]) + direction * .02,true);

      async function syncFromServer(resetToToday = false) {
        const requestId = ++syncRequestId;
        const requestRevision = localRevision;
        let loaded;
        let loadedGoals = weeklyGoalsState;
        let readFailure = null;
        try {
          await saveQueue;
          const results = await Promise.all([
            Store.loadWorklogState().catch(error => {
              if (error.cachedData === undefined) throw error;
              readFailure = error;
              return error.cachedData;
            }),
            Store.loadWeeklyGoalsState().catch(error => {
              readFailure = readFailure?.dailyLimit ? readFailure : error;
              console.warn('이번 주 목표를 불러오지 못했습니다.', error);
              return error.cachedData ?? weeklyGoalsState;
            })
          ]);
          loaded = normalizeState(results[0]);
          loadedGoals = results[1];
        } catch (error) {
          console.warn('업무일지 데이터를 불러오지 못했습니다.', error);
          readOnlyCache = true;
          const notice = document.getElementById('readStatus');
          notice.hidden = false;
          notice.textContent = error.dailyLimit ? '서버 한도 초과 · 표시할 이전 데이터가 없습니다. 오전 9시 이후 다시 확인합니다.' : '데이터를 불러오지 못했습니다. 연결 복구 후 다시 확인합니다.';
          card.dataset.readStatus = 'error';
          liveRegion.textContent = '불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';
          if (!ui.selectedDate) ui.selectedDate = localDateKey(clampDateToMode(todayDate(),state.mode));
          renderAll();
          return false;
        }
        if (requestId !== syncRequestId || requestRevision !== localRevision) return false;
        showReadWarning(readFailure);
        const goalsChanged = JSON.stringify(weeklyGoalsState) !== JSON.stringify(loadedGoals);
        weeklyGoalsState = loadedGoals;
        if (ui.adding || ui.editingId || ui.inlineEdit || ui.popover || ui.columnResize || ui.longPress || ui.rowDrag || addArea.querySelector('.mobile-add-input')?.value) {
          applyExternalCompletionState(loaded);
          if (goalsChanged || JSON.stringify(loaded) !== JSON.stringify(state)) {
            pendingExternalSync = true;
            pendingServerState = loaded;
          }
          return false;
        }
        const currentDayKey = localDateKey(todayDate());
        const dayChanged = currentDayKey !== activeDayKey;
        const changed = JSON.stringify(loaded) !== JSON.stringify(state);
        if (!changed && !goalsChanged && !resetToToday && !dayChanged) return true;
        activeDayKey = currentDayKey;
        resetToToday = resetToToday || dayChanged;
        state = loaded;
        pendingServerState = null;
        pendingExternalSync = readOnlyCache ? false : !rollDayIfNeeded();
        if (readOnlyCache) {
          if (!ui.selectedDate) ui.selectedDate = localDateKey(clampDateToMode(rememberedView()?.date || todayDate(),state.mode));
        } else if (resetToToday) applyOpenDefaults();
        else {
          const selected = clampDateToMode(parseDate(ui.selectedDate) || todayDate(),state.mode);
          ui.selectedDate = localDateKey(selected);
          rememberView();
        }
        liveRegion.textContent = '';
        renderAll();
        showReadWarning(readFailure);
        return true;
      }

      window.addEventListener('focus', () => syncFromServer(true));
      window.addEventListener('pageshow', () => syncFromServer(true));
      document.addEventListener('visibilitychange', () => { if (!document.hidden) syncFromServer(true); });
      mobileQuery.addEventListener?.('change', () => {
        if (!ui.adding && !ui.editingId && !ui.inlineEdit && !ui.popover) renderAll();
      });
      narrowQuery.addEventListener?.('change', () => {
        if (!ui.adding && !ui.editingId && !ui.inlineEdit && !ui.popover) renderDays();
      });
      window.addEventListener('widgetlayoutchange', () => {
        updateCompactLayout();
        if (!ui.adding && !ui.editingId && !ui.inlineEdit && !ui.popover) renderAll();
      });
      window.addEventListener('resize', updateCompactLayout);

      async function bootstrap() {
        liveRegion.textContent = '업무일지를 불러오는 중입니다.';
        const loaded = await syncFromServer(true);
        if (loaded && !entranceDone) {
          entranceDone = true;
          window.widgetMotion?.cascade?.(taskList.querySelectorAll('.task-row'));
        }
        Store.watch(() => syncFromServer(false),120000,{ allowWhileEditing:true, initial:false, allowCached:true,
          paths:['/api/worklog/', '/api/weekly-goals/'] });
      }

      bootstrap();
      window.addEventListener('load', alignSelectedDay, { once:true });
    })();

      let metadata = null;
      let imagesReady = false;
      let targetProgress = GrassFieldRenderer.dayProgress[4];
      let displayedProgress = targetProgress;
      let displayedReveal = 1;
      let frame = 0, transition = null, entrance = null;
      let entrancePlayed = false, visible = false, started = false;
      let windTime = 0, lastNow = 0, lastDraw = 0, layout = null;
      const easeOut = t => 1 - Math.pow(1 - Math.max(0, Math.min(1, t)), 3);

      function progressFor(dateKey) {
        const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateKey || ''));
        if (!match) return GrassFieldRenderer.dayProgress[4];
        const weekday = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]), 12).getDay();
        return GrassFieldRenderer.dayProgress[(weekday + 6) % 7];
      }

      function measureField() {
        const width = host.offsetWidth;
        if (!width) return;
        const height = Number.parseFloat(getComputedStyle(host).getPropertyValue('--wl-scene-height')) || 94;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        layout = { width, height, dpr };
        if (host.style.height !== height + 'px') host.style.height = height + 'px';
        const pixelWidth = Math.round(width * dpr);
        const pixelHeight = Math.round(height * dpr);
        if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
          canvas.width = pixelWidth;
          canvas.height = pixelHeight;
        }
      }

      function paintField(progress, reveal = displayedReveal) {
        displayedProgress = progress;
        displayedReveal = reveal;
        if (!imagesReady || !layout) return;
        const { width, height, dpr } = layout;
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        GrassFieldRenderer.draw(ctx, flowers, ground, metadata, progress, width, height, height, shrubs,
          { time:windTime, wind:motionEnabled() ? reveal : 0, entrance:reveal });
      }

      function pauseMotion() {
        cancelAnimationFrame(frame);
        frame = 0;
        lastNow = 0;
      }

      function tick(now) {
        frame = 0;
        if (!imagesReady || !visible || document.hidden || !motionEnabled()) {
          lastNow = 0;
          return;
        }
        const dt = lastNow ? Math.min(50, now - lastNow) : 16;
        lastNow = now;
        windTime += dt / 1000;
        let progress = displayedProgress;
        let reveal = displayedReveal;
        const active = Boolean(transition || entrance);
        if (transition) {
          transition.elapsed += dt;
          const t = Math.min(1, transition.elapsed / transition.duration);
          const eased = transition.to < transition.from ? GrassFieldRenderer.smooth(t) : easeOut(t);
          progress = transition.from + (transition.to - transition.from) * eased;
          if (t === 1) transition = null;
        }
        if (entrance) {
          entrance.elapsed += dt;
          const t = Math.min(1, entrance.elapsed / 800);
          reveal = easeOut(t);
          if (t === 1) entrance = null;

        if (active || now - lastDraw >= 1000 / 30) {

          lastDraw = now;

        frame = requestAnimationFrame(tick);

        if (!imagesReady || !visible || document.hidden) return;
        if (!motionEnabled()) {
          entrancePlayed = true;
          entrance = null;
          transition = null;
          paintField(targetProgress, 1);
          return;
        }
        if (!entrancePlayed) {
          entrancePlayed = true;
          entrance = { elapsed:0 };
          paintField(targetProgress, 0);
        }
        if (!frame) {
          lastNow = 0;
          frame = requestAnimationFrame(tick);
        }
      }

      function showField(target, animate = true) {
        if (!imagesReady) {
          displayedProgress = target;
          return;
        }
        if (!animate || !motionEnabled()) {
          transition = null;
          entrance = null;
          paintField(target, entrancePlayed ? 1 : 0);
          activateMotion();
          return;
        }
        if (Math.abs(target - displayedProgress) < 1e-6) {
          transition = null;
          activateMotion();
          return;
        }
        // 전환 중 다른 요일을 눌러도 현재 보이는 크기에서 이어간다.
        // 최초 등장과 바람의 시간은 초기화하지 않는다.
        transition = {
          from:displayedProgress, to:target, elapsed:0,
          duration:GrassFieldRenderer.transitionDuration(displayedProgress, target)
        };
        activateMotion();
      }

      window.worklogGrass = {
        setDate(dateKey) {
          const target = progressFor(dateKey);
          if (started && Math.abs(target - targetProgress) < 1e-6) return;
          targetProgress = target;
          const animate = started;
          started = true;
          showField(target, animate);
        }
      };

      Promise.all([
        Promise.resolve(paintPatches),
        new Promise((resolve, reject) => { flowers.onload = resolve; flowers.onerror = reject; flowers.src = '../assets/plants-v2.webp'; }),
        new Promise((resolve, reject) => { shrubs.onload = resolve; shrubs.onerror = reject; shrubs.src = '../assets/shrubs-v3.webp'; }),
        new Promise((resolve, reject) => { ground.onload = resolve; ground.onerror = reject; ground.src = '../assets/lawn-ground.webp'; })
      ]).then(([patches]) => {
        metadata = patches;
        imagesReady = true;
        measureField();
        paintField(targetProgress, entrancePlayed ? 1 : 0);
        activateMotion();
      }).catch(error => {
        console.warn('정원 이미지를 불러오지 못했습니다.', error);
        host.hidden = true;
      });

      new ResizeObserver(() => { measureField(); paintField(displayedProgress); }).observe(host);
      if (typeof IntersectionObserver === 'function') {
        new IntersectionObserver(entries => {
          visible = entries.some(entry => entry.isIntersecting);
          if (visible) activateMotion();
          else pauseMotion();
        }, { rootMargin:'32px 0px', threshold:.05 }).observe(host);
      } else {
        visible = true;
        activateMotion();
      }
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) pauseMotion();
        else activateMotion();
      });
      reducedMotion.addEventListener('change', () => {
        pauseMotion();
        if (!motionEnabled()) {
          entrance = null;
          transition = null;
          entrancePlayed = true;
          paintField(targetProgress, 1);
        } else activateMotion();
      });
